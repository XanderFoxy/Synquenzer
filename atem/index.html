<style>
:root{--hg:#0d1218;--fl:#151c25;--fl2:#1c2531;--rand:#2a3644;--text:#e6ecf2;--leise:#8a97a6;--akzent:#6cc4d9;--akzent2:#9a8fd6;--aus:#e0a87a;--warnung:#e3b76b;--gefahr:#e07a6e;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--hg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:grid;grid-template-rows:calc(44px + var(--st)) 1fr calc(56px + var(--sb));grid-template-columns:100%;overflow:hidden;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
h1{font-size:17px;margin:0;font-weight:600;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:21px;margin:.2em 0 .5em}h2.gross{font-size:28px}h3{font-size:15px;color:var(--leise);text-transform:uppercase;letter-spacing:.06em;margin:1.4em 0 .5em}
p{margin:.4em 0}ul,ol{padding-left:1.2em;margin:.4em 0}li{margin:.25em 0}
.sym{width:24px;height:24px;flex:none}.sym.gross{width:40px;height:40px}.sym.warn{color:var(--warnung);width:18px;height:18px;vertical-align:-3px}
#kopf{display:flex;align-items:center;gap:4px;padding:var(--st) calc(8px + var(--sr)) 0 calc(8px + var(--sl));border-bottom:1px solid var(--rand);background:var(--hg)}
#inhalt{overflow-y:auto;overscroll-behavior:contain;padding:16px calc(16px + var(--sr)) 24px calc(16px + var(--sl));-webkit-overflow-scrolling:touch}
#leiste{display:flex;justify-content:space-around;padding:0 var(--sr) var(--sb) var(--sl);border-top:1px solid var(--rand);background:var(--fl)}
#leiste a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--leise);min-height:56px;min-width:44px}
#leiste a.an{color:var(--akzent)}
.knopf-ico{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:var(--text);border-radius:12px;cursor:pointer;padding:0}
.knopf{min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid var(--rand);background:var(--fl2);color:var(--text);font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center}
.knopf.voll{width:100%;margin:8px 0}.knopf.haupt{background:var(--akzent);color:#0d1218;border-color:var(--akzent)}.knopf.gefahr{border:2px solid var(--gefahr);background:transparent;color:var(--text)}
.knopf.zweit{background:transparent;font-weight:500}.knopf.klein{min-height:44px;padding:6px 14px}.knopf.an{border-color:var(--akzent);color:var(--akzent)}.knopf:disabled{opacity:.4}
.knopf.schnell{width:100%;min-height:64px;font-size:18px;background:var(--akzent);color:#0d1218;border:0;margin:8px 0}
.startknopf{min-height:64px;font-size:18px}
.zwei{display:flex;gap:10px;margin:10px 0}.zwei>*{flex:1}
.karte{display:block;background:var(--fl);border:1px solid var(--rand);border-radius:18px;padding:14px 16px;margin:10px 0}.karte b{display:block;margin-bottom:4px}.karte span{color:var(--leise);font-size:14px}
.karte.notfall{border:2px solid var(--gefahr)}.karte.klein{padding:10px 12px;margin:0}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer}details.karte summary{font-weight:600}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kachel{display:flex;flex-direction:column;gap:4px;min-height:96px;background:var(--fl);border:1px solid var(--rand);border-radius:18px;padding:12px;color:var(--text)}
.kachel .sym{color:var(--akzent)}.kachel b{font-size:15px}.kachel span{font-size:12.5px;color:var(--leise);line-height:1.3}
.zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:10px 4px;border-bottom:1px solid var(--rand)}
.zeile small{display:block;color:var(--leise);font-size:13px}.zeile .rechts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--leise);white-space:nowrap}
.zeile.grau{opacity:.5}.ok{color:var(--akzent)}
.chips,.seg{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--rand);background:var(--fl);color:var(--text);font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}.chip.an{border-color:var(--akzent);color:var(--akzent)}
.abz{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--leise);margin:2px 6px 2px 0;white-space:nowrap}.abz svg{width:16px;height:10px}
.abz rect.voll{fill:var(--akzent)}.abz rect.leer{fill:var(--rand)}.abz-unbelegt span{font-style:italic}
.belege{display:flex;flex-wrap:wrap;margin:6px 0}
.hinweis{background:var(--fl2);border-left:3px solid var(--warnung);padding:8px 12px;border-radius:8px}.gesperrt{border-color:var(--gefahr)}
.leise{color:var(--leise);font-size:14px}.mitte{text-align:center}.fuss{color:var(--leise);font-size:12px;margin-top:28px}.link{color:var(--akzent);background:none;border:0;font:inherit;min-height:44px;display:inline-flex;align-items:center;cursor:pointer;padding:0}
.stufen .chip{flex:1;padding:0 6px}.chip:disabled{opacity:.4;cursor:default}.herk{font-size:12.5px;color:var(--leise);margin:4px 0;font-style:italic;display:block}ul.kapitel li{margin:6px 0;font-size:14px}
.stepper{display:flex;align-items:center;gap:12px;margin:10px 0}.stepper b{min-width:90px;text-align:center;font-size:18px}.stepper .knopf-ico{border:1px solid var(--rand)}
.schieber{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-size:14px}.schieber input{width:100%;min-height:44px;accent-color:var(--akzent)}
.schalter{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:10px}.schalter input{width:44px;height:44px;margin:0;accent-color:var(--akzent)}
.ablauf{display:block;margin:10px 0 2px}.ph-ein,.ph-ein2{fill:#6cc4d9}.ph-halten_voll{fill:#9a8fd6}.ph-aus,.ph-stoss_aus{fill:#e0a87a}.ph-halten_leer{fill:#5c6b8a}.ph-ruhe{fill:#3a4656}
.anleitung li{margin:.4em 0}.haltung{display:flex;align-items:center;gap:8px;color:var(--leise)}
.verlauf{margin:12px 0}.verlauf b{font-size:22px}.verlauf svg{width:100%;height:48px;color:var(--akzent)}.verlauf small{color:var(--leise)}
.quellen li{font-size:14px;margin-bottom:4px}.quellen a{color:var(--akzent);display:flex;align-items:center;min-height:44px}
.woche{display:flex;gap:10px;margin-top:8px}.punkt{width:14px;height:14px;border-radius:50%;background:var(--rand)}.punkt.voll{background:var(--akzent)}.punkt.ring{background:none;border:2px solid var(--rand)}.punkt.heute{background:none;border:2px solid var(--akzent)}
.kurven{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sicher-liste{list-style:none;padding:0}.sicher-liste li{display:flex;gap:12px;align-items:flex-start;margin:12px 0}.sicher-liste .sym{color:var(--akzent)}
.bilder{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.bilder div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;background:var(--fl2);border-radius:14px;padding:10px}.bilder .sym{color:var(--warnung)}
.messwert{font-size:56px;font-weight:700;margin:0;font-variant-numeric:tabular-nums}
.vtab{width:100%;border-collapse:collapse;font-size:13px}.vtab td,.vtab th{border-bottom:1px solid var(--rand);padding:6px 4px;text-align:left;vertical-align:top}
.vergleich{display:flex;flex-direction:column;gap:12px}.vg-fig{min-height:280px;background:var(--fl);border-radius:18px}.nur-quer{display:none}
.lunge-balken{width:100%;height:20px}.lunge-balken .leer{fill:var(--rand)}.lunge-balken .voll{fill:var(--akzent)}
.lesen{max-width:640px}
/* Blätter */
#sitzung,#blatt,#leiste{touch-action:manipulation}#blatt{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}#blatt[hidden]{display:none}
.dunkel{position:absolute;inset:0;background:rgba(5,8,12,.7)}
.blatt-innen{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--fl);border-radius:22px 22px 0 0;padding:20px calc(16px + var(--sr)) calc(20px + var(--sb)) calc(16px + var(--sl));overscroll-behavior:contain}
/* Sitzung */
#sitzung{position:fixed;inset:0;z-index:20;background:var(--hg);display:flex;flex-direction:column;padding:var(--st) var(--sr) var(--sb) var(--sl);overflow:hidden}#sitzung[hidden]{display:none}
body.in-sitzung #leiste,body.in-sitzung #kopf{visibility:hidden}
.sz-kopf{display:flex;align-items:center;height:44px;padding:0 8px}.sz-titel{flex:1;text-align:center;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sz-haupt{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px 0;min-height:0}
.sz-kreis{position:relative;display:flex;align-items:center;justify-content:center}.sz-kreis canvas{display:block}
.sz-mitte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.sz-mitte{text-shadow:0 1px 6px rgba(5,8,12,.9)}.sz-wort{font-size:28px;font-weight:600}.sz-zahl{font-size:68px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}.sz-hinweis{font-size:15px;color:var(--leise);min-height:20px}
.sz-zeile{display:flex;gap:14px;align-items:center;justify-content:center;min-height:40px;color:var(--leise);font-size:15px;font-variant-numeric:tabular-nums}.sz-weg{display:flex;align-items:center;gap:4px}
.vorschau{padding:0;overflow:hidden}.vs-fig{height:200px;background:var(--hg)}.vorschau.gross .vs-fig{height:360px}.vs-leiste{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px}.vs-wort{color:var(--leise);font-size:14px;font-variant-numeric:tabular-nums}
.sz-anat{position:relative;width:100%;height:170px;background:var(--fl);border-radius:18px;overflow:hidden;cursor:pointer}.sz-ans{position:absolute;top:0;right:0;z-index:1;min-width:64px;min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--leise);font:inherit;font-size:13px;cursor:pointer}.sz-anat.aus{display:none}
.figur-gross .sz-anat{height:320px}.figur-gross .sz-ans{top:auto;bottom:0}.figur-gross .sz-kreis{position:absolute;top:calc(56px + var(--st));right:16px;z-index:2}.figur-gross .sz-wort{font-size:14px}.figur-gross .sz-zahl{font-size:28px}.figur-gross .sz-hinweis{display:none}
.sz-tab{display:flex;gap:4px;align-items:flex-end;height:52px}.sz-tab-sp{display:flex;gap:1px;align-items:flex-end;opacity:.45}.sz-tab-sp.jetzt{opacity:1}.sz-tab-sp b{width:9px;background:#9a8fd6;border-radius:2px}.sz-tab-sp i{width:9px;background:#3a4656;border-radius:2px}
.sz-unten{padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px}.sz-warn{text-align:center;color:var(--warnung);font-size:14px;margin:0}
.sz-knoepfe{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sz-pause{width:64px;height:64px;border-radius:50%;border:1px solid var(--rand);background:var(--fl2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sz-normal{flex:1;min-height:72px;font-size:18px}
.sz-atmen,.sz-stopp{min-height:96px;border-radius:20px;border:0;background:var(--fl2);color:var(--text);font:inherit;font-size:22px;font-weight:600;cursor:pointer}.sz-atmen[hidden],.sz-stopp[hidden]{display:none}
.sz-stopp{background:var(--akzent2);color:#0d1218}
.sz-blatt{position:absolute;inset:0;z-index:5;background:rgba(5,8,12,.75);display:flex;align-items:flex-end;justify-content:center}.sz-blatt[hidden]{display:none}
/* Kopfkarte „Runde 3/8 · Phase“ (nur Übungen mit Runden): über dem Kreis, nie über seiner Mitte; Farben ≥ 4,5:1 auf --fl */
.sz-kk-block{display:contents}
.sz-kk{flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;width:clamp(min(240px,calc(100vw - 32px)),var(--kk-b,320px),calc(100vw - 60px));min-height:40px;padding:4px 14px;background:var(--fl);border:1px solid var(--rand);border-radius:14px;white-space:nowrap;line-height:1.2;font-variant-numeric:tabular-nums;pointer-events:none}
.sz-kk-runde{font-size:20px;font-weight:700;color:var(--text)}.sz-kk-phase{font-size:17px;font-weight:600;color:var(--leise);overflow:hidden;text-overflow:ellipsis}
.sz-kk-phase[data-art=zuege],.sz-kk-phase[data-art=pause]{color:#6cc4d9}.sz-kk-phase[data-art=halten]{color:#9a8fd6}
/* Quer */
@media (orientation:portrait){.figur-gross .sz-zeile{align-self:flex-start}.figur-gross .sz-anat{flex:1;height:auto;min-height:320px}.figur-gross .sz-kk{align-self:flex-start;width:calc(100% - 136px)}.mit-kk .sz-haupt{padding-top:4px}.mit-kk.figur-gross .sz-anat{min-height:280px}}
@media (orientation:portrait) and (max-width:399px){.figur-gross .sz-kk{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}.mit-kk.figur-gross .sz-anat{min-height:266px}}
@media (orientation:landscape){
 body{grid-template-columns:calc(72px + var(--sl)) 1fr;grid-template-rows:calc(44px + var(--st)) 1fr}
 #kopf{grid-column:2}#inhalt{grid-column:2;grid-row:2;padding-left:16px}
 #leiste{grid-column:1;grid-row:1/3;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--rand);padding:var(--st) 0 var(--sb) var(--sl)}
 #leiste a{min-height:64px;flex:none}
 .kacheln{grid-template-columns:repeat(3,1fr)}
 #inhalt>.start-links{float:left;width:280px;margin-right:16px}#inhalt>.kacheln{overflow:hidden;margin-top:0}
 .zweispaltig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.liste2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px}
 .blatt-innen{max-width:560px;border-radius:22px;max-height:96%;margin-bottom:2%}#blatt{align-items:center}
 .sz-haupt{flex-direction:row;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 88px 0 16px;gap:12px;align-content:center}
 .sz-zeile{position:absolute;left:calc(16px + var(--sl));bottom:calc(8px + var(--sb));width:320px}
 .sz-anat{width:300px;height:min(340px,calc(100vh - 80px))}.figur-gross .sz-anat{width:420px;height:min(360px,calc(100vh - 70px))}.figur-gross .sz-kreis{right:auto;left:calc(16px + var(--sl))}.figur-gross .sz-zeile{flex-direction:column;align-items:flex-start;gap:2px;width:180px}
 .sz-tab{flex-direction:column;height:auto;align-items:flex-start}.sz-tab-sp b,.sz-tab-sp i{height:8px!important}.sz-tab-sp b{width:40px}.sz-tab-sp i{width:24px}
 .sz-unten{position:absolute;right:var(--sr);top:calc(44px + var(--st));bottom:var(--sb);width:auto;max-width:300px;justify-content:center;padding:8px 12px}
 .riskant .sz-haupt{padding-right:236px}.riskant .sz-anat{width:300px}.riskant .sz-unten{width:220px}
 .sz-knoepfe{flex-direction:column}.sz-atmen,.sz-stopp{min-width:200px}
 .sz-kk-block{display:block;position:relative;flex:none}.sz-kk{position:absolute;left:0;right:0;bottom:calc(100% + 6px);width:auto;min-height:38px}
 .figur-gross .sz-kk-block{display:contents}.figur-gross .sz-kk{display:none}
 /* eng (kleine Handys quer, Notch): Maße aus querKreis() in fuehrung.js – nur wenn die Standard-Lage nicht passt */
 .eng .sz-haupt{flex-wrap:nowrap;padding:var(--q-pt) var(--q-pr) 48px 16px}.eng .sz-anat{width:var(--q-fw);height:var(--q-fh)}.eng .sz-kk{right:auto;min-width:100%;width:max-content}.eng.mit-kk .sz-kk-block{align-self:flex-start}.eng .sz-atmen,.eng .sz-stopp{max-width:200px}
 .eng.figur-gross .sz-haupt{padding:8px var(--q-pr) 8px 148px}.eng.figur-gross .sz-zeile{width:132px}
 .vergleich{flex-direction:row}.vg-fig{flex:1}.nur-quer{display:block}
 .kurven{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="kopf"></header>
<main id="inhalt" tabindex="-1"><p class="leise">Atem lädt …</p></main>
<nav id="leiste" aria-label="Bereiche"></nav>
<div id="blatt" hidden></div>
<div id="sitzung" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
