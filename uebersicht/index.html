<style>
/* Übersicht – eine Datei, kein Framework. Farben als Tokens; dunkel über prefers-color-scheme oder den Knopf oben (data-theme). */
:root {
  --bg: #f6f4fb; --fl: #ffffff; --tx: #1d1a29; --tx2: #57526b; --rand: #e2ddef; --akz: #6a45dc; --akz-tx: #ffffff;
  --neu: #0f7a43; --neu-bg: #dcf5e6; --alt-bg: #ecebf2; --schatten: 0 1px 2px rgb(30 20 60 / 6%), 0 6px 18px rgb(30 20 60 / 7%);
  /* Kachel-Farben: Farbton kommt je App aus --h */
  --kbS: 90%; --kbL: 97%; --krS: 60%; --krL: 87%; --kiS: 68%; --kiL: 47%; --kvS: 75%; --kvL: 90%; --kvtS: 55%; --kvtL: 27%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13111c; --fl: #1d1a29; --tx: #f1eff8; --tx2: #b1abc6; --rand: #322c47; --akz: #a78bfa; --akz-tx: #160f2a;
    --neu: #7ee2a8; --neu-bg: #173826; --alt-bg: #2a263a; --schatten: none;
    --kbS: 26%; --kbL: 14%; --krS: 32%; --krL: 27%; --kiS: 58%; --kiL: 52%; --kvS: 38%; --kvL: 25%; --kvtS: 85%; --kvtL: 86%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13111c; --fl: #1d1a29; --tx: #f1eff8; --tx2: #b1abc6; --rand: #322c47; --akz: #a78bfa; --akz-tx: #160f2a;
  --neu: #7ee2a8; --neu-bg: #173826; --alt-bg: #2a263a; --schatten: none;
  --kbS: 26%; --kbL: 14%; --krS: 32%; --krL: 27%; --kiS: 58%; --kiL: 52%; --kvS: 38%; --kvL: 25%; --kvtS: 85%; --kvtL: 86%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--tx);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.seite { max-width: 1120px; margin: 0 auto; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }

/* Kopf */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 4px 0 0; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-weight: 800; }
.regenbogen { height: 6px; width: 120px; border-radius: 3px; margin: 10px 0 8px;
  background: linear-gradient(90deg, #8b5cf6, #06b6d4, #22c55e, #f59e0b, #f43f5e); }
.unter { margin: 0 0 14px; color: var(--tx2); }
#thema { flex: none; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--rand);
  background: var(--fl); font-size: 15px; font-weight: 600; cursor: pointer; }
.suche { position: relative; margin-bottom: 12px; }
.suche input { width: 100%; min-height: 48px; padding: 0 16px 0 44px; border-radius: 14px; border: 1px solid var(--rand);
  background: var(--fl); font-size: 17px; outline: none; -webkit-appearance: none; appearance: none; }
.suche input:focus { border-color: var(--akz); box-shadow: 0 0 0 3px color-mix(in srgb, var(--akz) 25%, transparent); }
.suche svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--tx2); fill: none; stroke-width: 2; pointer-events: none; }
.sprung { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; padding: 0; list-style: none; }
.sprung a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; text-decoration: none;
  background: var(--fl); border: 1px solid var(--rand); font-size: 15px; font-weight: 600; }

/* Gruppen */
section { margin-top: 26px; scroll-margin-top: 12px; }
h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
.hinweis { margin: 0 0 12px; color: var(--tx2); font-size: 15px; }
.raster { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 680px) { .raster { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { .raster { grid-template-columns: 1fr 1fr 1fr; } }

/* Kachel: die ganze Fläche ist der Link (a.haupt::after), Chips liegen darüber */
.kachel { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start;
  min-height: 112px; padding: 16px; border-radius: 20px;
  background: hsl(var(--h) var(--kbS) var(--kbL)); border: 1px solid hsl(var(--h) var(--krS) var(--krL)); box-shadow: var(--schatten);
  transition: transform .12s ease; }
.kachel:active { transform: scale(.985); }
.ikon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: hsl(var(--h) var(--kiS) var(--kiL)); }
.ikon svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ikon svg .voll { fill: #fff; stroke: none; }
.kopfzeile { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.kachel h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 750; overflow-wrap: anywhere; }
.haupt { text-decoration: none; }
.haupt::after { content: ""; position: absolute; inset: 0; border-radius: 20px; }
.haupt:focus-visible { outline: none; }
.haupt:focus-visible::after { outline: 3px solid var(--akz); outline-offset: 2px; }
.extern { font-size: 15px; color: var(--tx2); font-weight: 600; }
.ver { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: hsl(var(--h) var(--kvS) var(--kvL)); color: hsl(var(--h) var(--kvtS) var(--kvtL)); white-space: nowrap; }
.kachel p { margin: 6px 0 0; font-size: 16px; color: var(--tx2); }
.chips { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; text-decoration: none;
  font-size: 15px; font-weight: 600; background: var(--fl); border: 1px solid hsl(var(--h) var(--krS) var(--krL)); }
.chips a:active { transform: scale(.97); }

/* Wege im Synquenzer */
.wege { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 900px) { .wege { grid-template-columns: 1fr 1fr; } }
.weg { padding: 16px; border-radius: 18px; background: var(--fl); border: 1px solid var(--rand); box-shadow: var(--schatten); min-width: 0; }
.weg h3 { margin: 0 0 10px; font-size: 18px; line-height: 1.3; }
.zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; }
.wann { flex: none; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px;
  background: var(--alt-bg); color: var(--tx2); }
.wann.neu { background: var(--neu-bg); color: var(--neu); }
.pfad { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; margin: 0; padding: 0; list-style: none; min-width: 0; }
.pfad li { display: inline-flex; align-items: center; min-width: 0; }
.pfad li + li::before { content: "›"; padding: 0 7px; color: var(--tx2); font-weight: 700; }
.taste { display: inline-block; padding: 4px 10px; border-radius: 9px; font-size: 15px; font-weight: 650; line-height: 1.3;
  background: var(--bg); border: 1px solid var(--rand); overflow-wrap: anywhere; }
.zeile.neu .taste { border-color: color-mix(in srgb, var(--neu) 45%, var(--rand)); }
.notiz { margin: 10px 0 0; font-size: 15px; color: var(--tx2); }

/* Werkstatt */
details.werk { margin-top: 26px; border-radius: 18px; border: 1px dashed var(--rand); padding: 0 16px; }
details.werk > summary { list-style: none; cursor: pointer; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 20px; font-weight: 750; }
details.werk > summary::-webkit-details-marker { display: none; }
details.werk > summary::after { content: "▾"; font-size: 18px; color: var(--tx2); transition: transform .15s; }
details.werk[open] > summary::after { transform: rotate(180deg); }
details.werk .innen { padding-bottom: 16px; }
.leer { display: none; margin-top: 20px; color: var(--tx2); }
footer { margin-top: 30px; color: var(--tx2); font-size: 14px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  preis: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle class="voll" cx="7.5" cy="7.5" r="1.6"/>',
  wind: '<path d="M3 9h10.5A3 3 0 1 0 10.5 6"/><path d="M3 14h14.5a3 3 0 1 1-3 3"/>',
  kamera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  kompass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z"/>',
  buch: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7.5h6"/>',
  sprech: '<path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9h8M8 12.5h5"/>',
  hase: '<path d="M9.5 8.7C7.4 6.6 6.3 2.5 8.1 2s3.1 3.3 3.4 6.1M14.5 8.7c2.1-2.1 3.2-6.2 1.4-6.7s-3.1 3.3-3.4 6.1"/><circle cx="12" cy="14.6" r="6.4"/><circle class="voll" cx="9.6" cy="13.9" r="1.15"/><circle class="voll" cx="14.4" cy="13.9" r="1.15"/><path d="M11 17.3h2"/>',
  probe: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/>',
  buchse: '<rect x="3" y="7" width="18" height="10" rx="2.5"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/>',
  pfeil: '<path d="M4 12h15M14 7l5 5-5 5"/>'
};

const $ = (s, w = document) => w.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
// Andere Schreibweisen, die die Suche auch findet (nur im Suchtext, nicht sichtbar): „QBasis“, „Q-Basis“, „Q Basis“ = Cubasis
const SYNONYME = { cubasis: 'qbasis kubasis' };
const suchText = s => { let t = norm(s); for (const w in SYNONYME) if (t.includes(w)) t += ' ' + SYNONYME[w]; return t; };
const suchWorte = s => norm(s).replace(/\bq[\s\-\u2010-\u2013]+(?=b|$)/g, 'q').trim().split(/\s+/).filter(Boolean);

function kachel(a) {
  const chips = (a.chips || []).map(c => `<a href="${esc(c.href)}">${esc(c.t)}</a>`).join('');
  const such = suchText([a.name, a.text, (a.chips || []).map(c => c.t).join(' '), a.gruppe].join(' '));
  return `<article class="kachel" style="--h:${a.farbe}" data-such="${esc(such)}">
    <div class="ikon" aria-hidden="true"><svg viewBox="0 0 24 24">${IKON[a.ikon] || ''}</svg></div>
    <div>
      <div class="kopfzeile"><h3><a class="haupt" href="${esc(a.link)}">${esc(a.name)}</a>${a.extern ? ' <span class="extern" aria-label="eigene Seite">↗</span>' : ''}</h3>${a.ver ? `<span class="ver" data-ver="${a.id}">${esc(a.ver)}</span>` : ''}</div>
      <p>${esc(a.text)}</p>${chips ? `<div class="chips">${chips}</div>` : ''}
    </div>
  </article>`;
}
function pfad(schritte) { return `<ol class="pfad">${schritte.map(s => `<li><span class="taste">${esc(s)}</span></li>`).join('')}</ol>`; }
function weg(w) {
  const such = suchText([w.titel, w.notiz, w.bisher.join(' '), (w.neu || []).join(' ')].join(' '));
  return `<div class="weg" data-such="${esc(such)}"><h3>${esc(w.titel)}</h3>
    <div class="zeile">${w.neu ? '<span class="wann">bisher</span>' : ''}${pfad(w.bisher)}</div>
    ${w.neu ? `<div class="zeile neu"><span class="wann neu">ab 4.83</span>${pfad(w.neu)}</div>` : ''}
    ${w.notiz ? `<p class="notiz">${esc(w.notiz)}</p>` : ''}</div>`;
}

let html = '';
for (const g of GRUPPEN) {
  const innen = g.id === 'finden' ? `<div class="wege">${WEGE.map(weg).join('')}</div>`
    : `<div class="raster">${APPS.filter(a => a.gruppe === g.id).map(kachel).join('')}</div>`;
  if (g.id === 'werkstatt') html += `<details class="werk gruppe" id="${g.id}"><summary>${esc(g.titel)}</summary><div class="innen"><p class="hinweis">${esc(g.hinweis)}</p>${innen}</div></details>`;
  else html += `<section class="gruppe" id="${g.id}"><h2>${esc(g.titel)}</h2><p class="hinweis">${esc(g.hinweis)}</p>${innen}</section>`;
}
$('#inhalt').innerHTML = html;
$('#sprung').innerHTML = GRUPPEN.map(g => `<li><a href="#${g.id}">${esc(g.titel)}</a></li>`).join('');

// Sprung zur Werkstatt klappt sie auf
const werk = $('#werkstatt');
const oeffneWerk = () => { if (location.hash === '#werkstatt' && werk) werk.open = true; };
addEventListener('hashchange', oeffneWerk); oeffneWerk();
$('#sprung').addEventListener('click', e => { const a = e.target.closest('a'); if (a && a.getAttribute('href') === '#werkstatt' && werk) werk.open = true; });

// Suche: blendet Kacheln und Wege aus, die das Wort nicht enthalten
const eingabe = $('#suche');
eingabe.addEventListener('input', () => {
  const w = suchWorte(eingabe.value);
  let treffer = 0;
  document.querySelectorAll('[data-such]').forEach(el => { const ok = w.every(x => el.dataset.such.includes(x)); el.hidden = !ok; if (ok) treffer++; });
  document.querySelectorAll('.gruppe').forEach(g => { g.hidden = !g.querySelector('[data-such]:not([hidden])'); });
  if (werk && w.length && !werk.hidden) werk.open = true;
  $('#leer').style.display = treffer ? 'none' : 'block';
});

// Hell / Dunkel: Auto → Hell → Dunkel (pro Gerät gemerkt)
const THEMEN = ['auto', 'light', 'dark'], NAME = { auto: 'Auto', light: 'Hell', dark: 'Dunkel' };
let thema = 'auto';
try { thema = localStorage.getItem('uebersicht.thema') || 'auto'; } catch (e) {}
const setzeThema = t => {
  thema = THEMEN.includes(t) ? t : 'auto';
  if (thema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', thema);
  $('#thema').textContent = NAME[thema];
};
setzeThema(thema);
$('#thema').addEventListener('click', () => { setzeThema(THEMEN[(THEMEN.indexOf(thema) + 1) % 3]); try { localStorage.setItem('uebersicht.thema', thema); } catch (e) {} });

// Versionen frisch aus den Apps lesen – erst nach dem Zeichnen, klein (kopf: nur die ersten 16 KB), Fehler = bekannte Version bleibt
async function liesVersion(a) {
  const q = a.quelle, el = document.querySelector(`[data-ver="${a.id}"]`);
  if (!q || !el) return;
  try {
    const r = await fetch(q.url, { cache: 'no-cache', headers: q.kopf ? { Range: 'bytes=0-16383' } : {} });
    if (!r.ok) return;
    const m = (await r.text()).match(q.muster);
    if (m) { const v = (q.vor || '') + m[1]; el.textContent = v; el.title = 'frisch gelesen'; el.dataset.frisch = '1'; }
  } catch (e) { /* offline oder gesperrt: bekannte Version bleibt stehen */ }
}
const spaeter = window.requestIdleCallback || (f => setTimeout(f, 300));
spaeter(() => APPS.forEach(liesVersion), { timeout: 1500 });
</script>
