<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13111c" media="(prefers-color-scheme: dark)">
<title>Alle Apps</title>
<meta name="description" content="Alle Apps an einem Ort – was neu ist, Woche für Woche.">
<meta name="apple-mobile-web-app-title" content="Alle Apps">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%238b5cf6'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%2306b6d4'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%23f97316'/%3E%3Crect x='17' y='17' width='13' height='13' rx='3' fill='%2322c55e'/%3E%3C/svg%3E">
<style>
/* Übersicht – eine Datei, kein Framework. Farben als Tokens; dunkel über prefers-color-scheme oder den Knopf oben (data-theme). */
:root {
  --bg: #f6f4fb; --fl: #ffffff; --tx: #1d1a29; --tx2: #57526b; --rand: #e2ddef; --akz: #6a45dc; --akz-tx: #ffffff;
  --neu: #0f7a43; --neu-bg: #dcf5e6; --alt-bg: #ecebf2; --schatten: 0 1px 2px rgb(30 20 60 / 6%), 0 6px 18px rgb(30 20 60 / 7%);
  --bra-bg: #fff3d1; --bra-rand: #e9b942; --bra-tx: #4f3500; --bra-akz: #b77900;
  /* Kachel-Farben: Farbton kommt je App aus --h */
  --kbS: 90%; --kbL: 97%; --krS: 60%; --krL: 87%; --kiS: 68%; --kiL: 47%; --kvS: 75%; --kvL: 90%; --kvtS: 55%; --kvtL: 27%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13111c; --fl: #1d1a29; --tx: #f1eff8; --tx2: #b1abc6; --rand: #322c47; --akz: #a78bfa; --akz-tx: #160f2a;
    --neu: #7ee2a8; --neu-bg: #173826; --alt-bg: #2a263a; --schatten: none;
    --bra-bg: #30250c; --bra-rand: #75581a; --bra-tx: #ffdf9a; --bra-akz: #f5b83d;
    --kbS: 26%; --kbL: 14%; --krS: 32%; --krL: 27%; --kiS: 58%; --kiL: 52%; --kvS: 38%; --kvL: 25%; --kvtS: 85%; --kvtL: 86%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13111c; --fl: #1d1a29; --tx: #f1eff8; --tx2: #b1abc6; --rand: #322c47; --akz: #a78bfa; --akz-tx: #160f2a;
  --neu: #7ee2a8; --neu-bg: #173826; --alt-bg: #2a263a; --schatten: none;
  --bra-bg: #30250c; --bra-rand: #75581a; --bra-tx: #ffdf9a; --bra-akz: #f5b83d;
  --kbS: 26%; --kbL: 14%; --krS: 32%; --krL: 27%; --kiS: 58%; --kiL: 52%; --kvS: 38%; --kvL: 25%; --kvtS: 85%; --kvtL: 86%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--tx);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.seite { max-width: 1120px; margin: 0 auto; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* Kopf */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 4px 0 0; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-weight: 800; }
.regenbogen { height: 6px; width: 120px; border-radius: 3px; margin: 10px 0 8px;
  background: linear-gradient(90deg, #8b5cf6, #06b6d4, #22c55e, #f59e0b, #f43f5e); }
.unter { margin: 0 0 14px; color: var(--tx2); }
#thema { flex: none; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--rand);
  background: var(--fl); font-size: 15px; font-weight: 600; }
.suche { position: relative; margin-bottom: 14px; }
.suche input { width: 100%; min-height: 48px; padding: 0 16px 0 44px; border-radius: 14px; border: 1px solid var(--rand);
  background: var(--fl); font-size: 17px; outline: none; -webkit-appearance: none; appearance: none; }
.suche input:focus { border-color: var(--akz); box-shadow: 0 0 0 3px color-mix(in srgb, var(--akz) 25%, transparent); }
.suche svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--tx2); fill: none; stroke-width: 2; pointer-events: none; }

/* „Brauche ich von dir“ – gut sichtbar, nur wenn etwas aussteht */
.brauche { margin: 0 0 16px; padding: 12px 14px 4px; border-radius: 18px; background: var(--bra-bg); border: 1px solid var(--bra-rand); color: var(--bra-tx); }
.brauche h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 2px; font-size: 19px; line-height: 1.25; }
.brauche h2 svg { flex: none; width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.brauche h2 svg .voll { fill: currentColor; stroke: none; }
.brauche ul { list-style: none; margin: 0; padding: 0; }
.brauche li + li { border-top: 1px solid color-mix(in srgb, var(--bra-rand) 55%, transparent); }
.brauche a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; min-height: 52px; padding: 7px 0; text-decoration: none; }
.brauche .b-app { grid-column: 1; justify-self: start; font-size: 13px; font-weight: 800; padding: 1px 8px; border-radius: 8px;
  background: hsl(var(--h) var(--kvS) var(--kvL)); color: hsl(var(--h) var(--kvtS) var(--kvtL)); }
.brauche .b-tx { grid-column: 1; font-size: 16px; font-weight: 600; line-height: 1.3; }
.brauche .pf { grid-column: 2; grid-row: 1 / span 2; font-size: 22px; font-weight: 700; opacity: .75; }

/* Umschalter: Nach Woche / Nach App, darunter die Wochen oder die Apps */
.steuer { scroll-margin-top: 8px; }
.umschalter { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--alt-bg); }
.umschalter button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; font-size: 16px; font-weight: 700; color: var(--tx2); }
.umschalter button[aria-pressed="true"] { background: var(--fl); color: var(--tx); box-shadow: 0 1px 3px rgb(0 0 0 / 14%); }
.wochen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
@media (min-width: 680px) { .wochen { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.wo { min-height: 58px; padding: 6px 4px; border-radius: 14px; border: 1px solid var(--rand); background: var(--fl);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; min-width: 0; }
.wo b { font-size: 15px; line-height: 1.2; font-weight: 750; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.wo small { font-size: 13px; color: var(--tx2); font-variant-numeric: tabular-nums; }
.wo[aria-pressed="true"], .aw[aria-pressed="true"] { background: var(--akz); border-color: var(--akz); color: var(--akz-tx); }
.wo[aria-pressed="true"] small { color: inherit; opacity: .85; }
.wo:active, .aw:active, .blaettern button:active, .chips a:active { transform: scale(.97); }
.appwahl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.aw { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--rand);
  background: var(--fl); font-size: 15px; font-weight: 650; }
.aw i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h) var(--kiS) var(--kiL)); }
.aw[aria-pressed="true"] i { background: currentColor; }
.info { margin: 12px 2px 10px; font-size: 15px; color: var(--tx2); }

/* Raster und Kacheln: die ganze Kachel ist der Link zur App (a.haupt::after), Knöpfe liegen darüber */
.raster { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
@media (min-width: 680px) { .raster { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { .raster { grid-template-columns: 1fr 1fr 1fr; } }
.kachel { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 14px; align-items: center; align-content: start;
  min-height: 88px; padding: 16px; border-radius: 20px; scroll-margin-top: 12px;
  background: hsl(var(--h) var(--kbS) var(--kbL)); border: 1px solid hsl(var(--h) var(--krS) var(--krL)); box-shadow: var(--schatten);
  transition: transform .12s ease; }
.kachel:active { transform: scale(.985); }
.ikon { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: hsl(var(--h) var(--kiS) var(--kiL)); }
.ikon svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ikon svg .voll { fill: #fff; stroke: none; }
.rumpf { min-width: 0; }
.unten { grid-column: 1 / -1; min-width: 0; margin-top: 4px; }
.kopfzeile { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.kachel h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 750; overflow-wrap: anywhere; }
.haupt { text-decoration: none; }
.haupt::after { content: ""; position: absolute; inset: 0; border-radius: 20px; }
.haupt:focus-visible { outline: none; }
.haupt:focus-visible::after { outline: 3px solid var(--akz); outline-offset: 2px; }
.extern { font-size: 15px; color: var(--tx2); font-weight: 600; }
.ver { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: hsl(var(--h) var(--kvS) var(--kvL)); color: hsl(var(--h) var(--kvtS) var(--kvtL)); white-space: nowrap; }
.ver.alt { background: var(--alt-bg); color: var(--tx2); }
.kachel p { margin: 6px 0 0; font-size: 16px; color: var(--tx2); }
.etikett { display: block; margin: 10px 0 2px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--tx2); }
.punkte { margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.4; }
.punkte li { margin: 3px 0; overflow-wrap: anywhere; }
.punkte li::marker { color: hsl(var(--h) var(--kiS) var(--kiL)); }
.punkte.leise { color: var(--tx2); font-size: 15px; }
.punkte li.mehr { list-style: none; font-size: 14px; color: var(--tx2); }
.bra { margin-top: 12px; padding: 6px 12px 8px; border-radius: 12px; background: var(--bra-bg); border: 1px solid var(--bra-rand); color: var(--bra-tx); }
.bra .etikett { margin-top: 4px; color: inherit; }
.bra .punkte li::marker { color: var(--bra-akz); }
.tag { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 800; vertical-align: 1px;
  background: var(--alt-bg); color: var(--tx2); }
.chips { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; text-decoration: none;
  font-size: 15px; font-weight: 600; background: var(--fl); border: 1px solid hsl(var(--h) var(--krS) var(--krL)); }
.ohne { margin-top: 16px; }
.ohne p { margin: 0; font-size: 15px; color: var(--tx2); }
.ohne .chips { margin-top: 6px; }
.blaettern { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.blaettern button { min-height: 48px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--rand); background: var(--fl); font-size: 15px; font-weight: 700; }
.blaettern button:disabled { visibility: hidden; }

/* Ansicht je App: Kopf-Kachel, „Jetzt“ und der Strang Woche für Woche */
.app-ansicht { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; scroll-margin-top: 12px; }
@media (min-width: 860px) { .app-ansicht { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .app-ansicht > .kachel { grid-column: 1 / -1; } }
.tafel { min-width: 0; padding: 14px 16px 16px; border-radius: 18px; background: var(--fl); border: 1px solid var(--rand); box-shadow: var(--schatten); }
.tafel h3 { margin: 0; font-size: 18px; }
.tafel > .etikett:first-of-type { margin-top: 6px; }
.strang { list-style: none; margin: 10px 0 0; padding: 0; }
.strang > li { position: relative; padding: 0 0 14px 24px; }
.strang > li::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: -4px; width: 2px; background: var(--rand); }
.strang > li:last-child { padding-bottom: 0; }
.strang > li:last-child::before { display: none; }
.strang > li::after { content: ""; position: absolute; left: 1px; top: 5px; width: 12px; height: 12px; border-radius: 50%;
  background: hsl(var(--h) var(--kiS) var(--kiL)); box-shadow: 0 0 0 3px var(--fl); }
.s-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 2px; }
.s-kopf b { font-size: 16px; }
.s-kopf .datum { font-size: 14px; color: var(--tx2); font-variant-numeric: tabular-nums; }
.leer-text { margin: 8px 0 0; color: var(--tx2); font-size: 15px; }

/* Werkzeuge */
.werkzeuge { margin-top: 28px; }
h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.01em; }
.hinweis { margin: 0 0 10px; color: var(--tx2); font-size: 15px; }
.wz { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--rand); background: var(--fl); }
.wz + .wz { margin-top: 8px; }
.wz a { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; font-weight: 700; text-decoration: none;
  background: hsl(var(--h) var(--kbS) var(--kbL)); border: 1px solid hsl(var(--h) var(--krS) var(--krL)); }
.wz span { flex: 1 1 200px; min-width: 0; color: var(--tx2); font-size: 15px; }

/* Wege im Synquenzer (zugeklappt) */
details.werk { margin-top: 26px; border-radius: 18px; border: 1px dashed var(--rand); padding: 0 16px; scroll-margin-top: 12px; }
details.werk > summary { list-style: none; cursor: pointer; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 18px; font-weight: 750; }
details.werk > summary::-webkit-details-marker { display: none; }
details.werk > summary::after { content: "▾"; font-size: 18px; color: var(--tx2); transition: transform .15s; }
details.werk[open] > summary::after { transform: rotate(180deg); }
details.werk .innen { padding-bottom: 16px; }
.wege { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 900px) { .wege { grid-template-columns: 1fr 1fr; } }
.weg { padding: 16px; border-radius: 18px; background: var(--fl); border: 1px solid var(--rand); box-shadow: var(--schatten); min-width: 0; }
.weg h3 { margin: 0 0 10px; font-size: 18px; line-height: 1.3; }
.zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; }
.wann { flex: none; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px;
  background: var(--alt-bg); color: var(--tx2); }
.wann.neu { background: var(--neu-bg); color: var(--neu); }
.pfad { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; margin: 0; padding: 0; list-style: none; min-width: 0; }
.pfad li { display: inline-flex; align-items: center; min-width: 0; }
.pfad li + li::before { content: "›"; padding: 0 7px; color: var(--tx2); font-weight: 700; }
.taste { display: inline-block; padding: 4px 10px; border-radius: 9px; font-size: 15px; font-weight: 650; line-height: 1.3;
  background: var(--bg); border: 1px solid var(--rand); overflow-wrap: anywhere; }
.zeile.neu .taste { border-color: color-mix(in srgb, var(--neu) 45%, var(--rand)); }
.notiz { margin: 10px 0 0; font-size: 15px; color: var(--tx2); }
.leer { display: none; margin-top: 20px; color: var(--tx2); }
footer { margin-top: 30px; color: var(--tx2); font-size: 14px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.adr{display:block;font-size:.78em;opacity:.62;margin:.1em 0 .2em;user-select:all;-webkit-user-select:all;word-break:break-all}
</style>
</head>
<body>
<div class="seite">
<header>
  <div class="kopf">
    <h1>Alle Apps</h1>
    <button id="thema" type="button" aria-label="Hell oder dunkel">Auto</button>
  </div>
  <div class="regenbogen" aria-hidden="true"></div>
  <p class="unter">Antippen und los – darunter steht, was neu ist.</p>
  <div class="suche">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="suche" type="search" placeholder="Suchen, z. B. Chor, Fotos, Video" aria-label="Apps und Neuigkeiten durchsuchen" autocomplete="off">
  </div>
</header>
<section class="brauche" id="brauche" hidden></section>
<nav class="steuer" id="steuer" aria-label="Ansicht">
  <div class="umschalter">
    <button type="button" id="um-woche" aria-pressed="true">Nach Woche</button>
    <button type="button" id="um-app" aria-pressed="false">Nach App</button>
  </div>
  <div class="wochen" id="wochen"></div>
  <div class="appwahl" id="appwahl" hidden></div>
</nav>
<main id="inhalt"></main>
<p class="leer" id="leer">Nichts gefunden.</p>
<section class="werkzeuge" id="werkzeuge"></section>
<details class="werk" id="finden"><summary>Wo finde ich was im Synquenzer?</summary><div class="innen" id="wege-innen"></div></details>
<footer id="fuss">Die Versionen liest die Seite beim Öffnen frisch aus den Apps.</footer>
</div>

  preis: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle class="voll" cx="7.5" cy="7.5" r="1.6"/>',
  wind: '<path d="M3 9h10.5A3 3 0 1 0 10.5 6"/><path d="M3 14h14.5a3 3 0 1 1-3 3"/>',
  kamera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
  kompass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z"/>',
  buch: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7.5h6"/>',
  sprech: '<path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9h8M8 12.5h5"/>',
  hase: '<path d="M9.5 8.7C7.4 6.6 6.3 2.5 8.1 2s3.1 3.3 3.4 6.1M14.5 8.7c2.1-2.1 3.2-6.2 1.4-6.7s-3.1 3.3-3.4 6.1"/><circle cx="12" cy="14.6" r="6.4"/><circle class="voll" cx="9.6" cy="13.9" r="1.15"/><circle class="voll" cx="14.4" cy="13.9" r="1.15"/><path d="M11 17.3h2"/>',
  noten: '<path d="M9 17.5V5.5l11-2v12"/><circle class="voll" cx="6.5" cy="17.5" r="2.5"/><circle class="voll" cx="17.5" cy="15.5" r="2.5"/>',
  idee: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>'
};

const $ = (s, w = document) => w.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
// Andere Schreibweisen, die die Suche auch findet (nur im Suchtext, nicht sichtbar): „QBasis“, „Q-Basis“, „Q Basis“ = DAW
const SYNONYME = { daw: 'cubasis qbasis kubasis', cubasis: 'qbasis kubasis daw' };
const suchText = s => { let t = norm(s); for (const w in SYNONYME) if (t.includes(w)) t += ' ' + SYNONYME[w]; return t; };
const suchWorte = s => norm(s).replace(/\bq[\s\-‐-–]+(?=b|$)/g, 'q').trim().split(/\s+/).filter(Boolean);

/* ---------- Daten zusammenführen ---------- */
let DATEN = {};
try { DATEN = JSON.parse($('#daten').textContent) || {}; } catch (e) { DATEN = {}; }
const TEXTE = (DATEN.apps && DATEN.apps.haupt) || [];
const VERLAUF = (DATEN.verlauf && DATEN.verlauf.apps) || {};
const LISTE = APPS.map(a => {
  const t = TEXTE.find(x => x.id === a.id) || {};
  return { ...t, ...a, ver: a.ver || t.version || '' };
}).concat(TEXTE.filter(t => !APPS.some(a => a.id === t.id)).map(t => ({ ikon: 'idee', farbe: 250, ...t, ver: t.version || '' })));
const WERKZEUGE = ((DATEN.apps && DATEN.apps.werkzeuge) || []).map(w => ({ farbe: WERKZEUG_FARBE[w.id] ?? 25, ...w }));
const liste = (x, n) => (Array.isArray(x) ? x : []).slice(0, n);

/* ---------- Wochen (Montag bis Sonntag). Namen rechnet die Seite aus dem heutigen Datum. ---------- */
const TAG = 864e5;
const tagNr = iso => { const [y, m, d] = String(iso).split('-').map(Number); return Date.UTC(y, m - 1, d) / TAG; };
const isoVon = nr => new Date(nr * TAG).toISOString().slice(0, 10);
const jetzt = new Date();
const wtag = (jetzt.getDay() + 6) % 7; // 0 = Montag … 6 = Sonntag
const montagHeute = Date.UTC(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate()) / TAG - wtag;
const tm = iso => { const [, m, d] = String(iso).split('-').map(Number); return [d, m]; };
const spanne = (von, bis) => { const [d1, m1] = tm(von), [d2, m2] = tm(bis || isoVon(tagNr(von) + 6)); return m1 === m2 ? `${d1}.–${d2}.${m2}.` : `${d1}.${m1}.–${d2}.${m2}.`; };
const relName = von => {
  const i = Math.max(0, Math.round((montagHeute - tagNr(von)) / 7));
  return i === 0 ? (wtag >= 5 ? 'Dieses Wochenende' : 'Diese Woche') : i === 1 ? 'Voriges' : i === 2 ? 'Vorvoriges' : `Vor ${i} Wochen`;
};
const EINZELN = 5; // so viele Wochen bekommen einen eigenen Knopf, alles davor steht unter „Älter“
const sichtbar = new Set(LISTE.map(a => a.id));
const alleVon = [...new Set(Object.entries(VERLAUF).filter(([id]) => sichtbar.has(id))
  .flatMap(([, a]) => (a.wochen || []).map(w => w.von)))].sort().reverse();
const WOCHEN = alleVon.slice(0, EINZELN).map(von => ({ key: von, von: [von], name: relName(von), datum: spanne(von) }));
if (alleVon.length > EINZELN) {
  const rest = alleVon.slice(EINZELN), [d, m] = tm(isoVon(tagNr(rest[0]) + 6));
  WOCHEN.push({ key: 'aelter', von: rest, name: 'Älter', datum: `bis ${d}.${m}.` });
}
const eintraege = (id, w) => ((VERLAUF[id] && VERLAUF[id].wochen) || []).filter(x => w.von.includes(x.von));
const ersteWoche = id => ((VERLAUF[id] && VERLAUF[id].wochen) || []).map(x => x.von).sort()[0] || null;

/* ---------- Bausteine ---------- */
const FRISCH = {}; // frisch gelesene Versionen
const verBadge = a => a.ver ? `<span class="ver" data-ver="${esc(a.id)}"${FRISCH[a.id] ? ' data-frisch="1" title="frisch gelesen"' : ''}>${esc(FRISCH[a.id] || a.ver)}</span>` : '';
const punkte = (arr, klasse = '', mehr = '') => `<ul class="punkte${klasse ? ' ' + klasse : ''}">${arr.map(p => `<li>${esc(p)}</li>`).join('')}${mehr ? `<li class="mehr">${esc(mehr)}</li>` : ''}</ul>`;
const block = (titel, arr, klasse, mehr) => `<span class="etikett">${esc(titel)}</span>${punkte(arr, klasse, mehr)}`;
const braucheBlock = a => a.brauche && a.brauche.length ? `<div class="bra">${block('Brauche ich von dir', a.brauche)}</div>` : '';
const zuApp = a => `<a href="#app=${esc(a.id)}" data-spring=".app-ansicht">Alle Wochen ›</a>`;
const appLink = a => `<a href="${esc(a.link)}" style="--h:${a.farbe}">${esc(a.name)}${a.extern ? '&nbsp;↗' : ''}</a>`;
// Kopf: Symbol + Name + Version (+ kurzer Text daneben); darunter in voller Breite die Listen und Knöpfe
function kachel(a, badge, innen, fuss = '', kurz = '') {
  const unten = innen + (fuss ? `<div class="chips">${fuss}</div>` : '');
  return `<article class="kachel" style="--h:${a.farbe}" id="k-${esc(a.id)}">
    <div class="ikon" aria-hidden="true"><svg viewBox="0 0 24 24">${IKON[a.ikon] || IKON.idee}</svg></div>
    <div class="rumpf">
      <div class="kopfzeile"><h3><a class="haupt" href="${esc(a.link)}">${esc(a.name)}</a>${a.extern ? ' <span class="extern" aria-label="eigene Seite">↗</span>' : ''}</h3>${badge}</div>
      ${a.adr ? `<small class="adr">${esc(a.adr)}</small>` : ''}
      ${kurz ? `<p>${esc(kurz)}</p>` : ''}
    </div>${unten ? `<div class="unten">${unten}</div>` : ''}
  </article>`;
}

/* ---------- Ansicht „Nach Woche“ ---------- */
function karteWoche(a, e, erste) {
  if (erste) {
    // Neueste Woche: was er jetzt ausprobieren kann, woran gerade gearbeitet wird, und was ich brauche
    const basis = liste(a.ausprobieren, 4).length ? liste(a.ausprobieren, 4) : liste(e[0].neu, 5);
    // Ist die App in dieser Woche neu dazugekommen, steht das oben (Punkt „Neue App: …“ aus verlauf.json)
    const neuApp = e.flatMap(x => liste(x.neu, 9)).find(p => /^Neue App\b/.test(p));
    const probier = neuApp && !basis.includes(neuApp) ? [neuApp, ...basis].slice(0, 5) : basis;
    const arbeit = liste(a.in_arbeit, 9), mehr = arbeit.length > 2 ? `+ ${arbeit.length - 2} weitere unter „Alle Wochen“` : '';
    return kachel(a, verBadge(a), block('Neu – probier aus', probier) + (arbeit.length ? block('In Arbeit', arbeit.slice(0, 2), 'leise', mehr) : '') + braucheBlock(a), zuApp(a));
  }
  if (e.length === 1) return kachel(a, e[0].version ? `<span class="ver alt">damals ${esc(e[0].version)}</span>` : '', block('Neu', liste(e[0].neu, 9)), zuApp(a));
  return kachel(a, '', e.map(x => block(`${spanne(x.von, x.bis)}${x.version ? ' · ' + x.version : ''}`, liste(x.neu, 9))).join(''), zuApp(a));
}
function zeichneWoche() {
  const i = Math.max(0, WOCHEN.findIndex(x => x.key === zustand.woche)), w = WOCHEN[i];
  if (!w) return '<p class="leer-text">Noch kein Verlauf eingetragen.</p>';
  const mit = [], ohne = [];
  for (const a of LISTE) {
    const e = eintraege(a.id, w), seit = ersteWoche(a.id);
    if (e.length) mit.push([a, e]);
    else if (seit ? seit < w.von[w.von.length - 1] : i === 0) ohne.push([a, e]); // nur Apps, die es da schon gab
  }
  const vor = WOCHEN[i - 1], nach = WOCHEN[i + 1];
  return `<p class="info">${esc(w.name)} · ${esc(w.datum)} · ${mit.length ? `Neues in ${mit.length} ${mit.length === 1 ? 'App' : 'Apps'}` : 'nichts Neues'}</p>
    <div class="raster">${mit.map(([a, e]) => karteWoche(a, e, i === 0)).join('')}</div>
    ${ohne.length ? `<div class="ohne"><p>In dieser Woche ohne Neues:</p><div class="chips">${ohne.map(([a]) => appLink(a)).join('')}</div></div>` : ''}
    <div class="blaettern">
      <button type="button" data-geh="${vor ? 'woche=' + vor.key : ''}"${vor ? '' : ' disabled'}>‹ Neuere Woche</button>
      <button type="button" data-geh="${nach ? 'woche=' + nach.key : ''}"${nach ? '' : ' disabled'}>Frühere Woche ›</button>
    </div>`;
}

/* ---------- Ansicht „Nach App“: alle Wochen untereinander ---------- */
function zeichneApp() {
  const i = Math.max(0, LISTE.findIndex(x => x.id === zustand.app)), a = LISTE[i];
  const wochen = (VERLAUF[a.id] && VERLAUF[a.id].wochen) || [];
  const jetztTeil = (liste(a.ausprobieren, 9).length ? block('Probier aus', liste(a.ausprobieren, 9)) : '')
    + (liste(a.in_arbeit, 9).length ? block('In Arbeit', liste(a.in_arbeit, 9), 'leise') : '') + braucheBlock(a);
  const strang = wochen.length ? `<ol class="strang">${wochen.map(w => `<li>
      <div class="s-kopf"><b>${esc(relName(w.von))}</b><span class="datum">${esc(spanne(w.von, w.bis))}</span>${w.version ? `<span class="ver">${esc(w.version)}</span>` : ''}</div>
      ${punkte(liste(w.neu, 9))}</li>`).join('')}</ol>` : '<p class="leer-text">Für diese App gibt es noch keinen Verlauf.</p>';
  const vor = LISTE[i - 1], nach = LISTE[i + 1];
  return `<div class="app-ansicht" style="--h:${a.farbe}">
      ${kachel(a, verBadge(a), '', '', a.kurz)}
      ${jetztTeil ? `<section class="tafel"><h3>Jetzt</h3>${jetztTeil}</section>` : ''}
      <section class="tafel"><h3>Woche für Woche</h3>${strang}</section>
    </div>
    <div class="blaettern">
      <button type="button" data-geh="${vor ? 'app=' + vor.id : ''}" data-spring=".app-ansicht"${vor ? '' : ' disabled'}>‹ ${esc(vor ? vor.chip || vor.name : '')}</button>
      <button type="button" data-geh="${nach ? 'app=' + nach.id : ''}" data-spring=".app-ansicht"${nach ? '' : ' disabled'}>${esc(nach ? nach.chip || nach.name : '')} ›</button>
    </div>`;
}

/* ---------- Suche: Treffer aus allen Apps und allen Wochen ---------- */
function zeichneSuche(worte) {
  let karten = '';
  for (const a of LISTE) {
    const nameTreffer = worte.every(w => suchText(a.name).includes(w));
    const zeilen = [];
    if (!nameTreffer) {
      const pruefe = (tag, t) => { const s = suchText(a.name + ' ' + t); if (worte.every(w => s.includes(w))) zeilen.push([tag, t]); };
      if (a.kurz) pruefe('', a.kurz);
      liste(a.ausprobieren, 99).forEach(t => pruefe('Probier aus', t));
      liste(a.in_arbeit, 99).forEach(t => pruefe('In Arbeit', t));
      liste(a.brauche, 99).forEach(t => pruefe('Brauche ich', t));
      ((VERLAUF[a.id] && VERLAUF[a.id].wochen) || []).forEach(w => liste(w.neu, 99).forEach(t => pruefe(spanne(w.von, w.bis), t)));
    }
    if (nameTreffer || zeilen.length) karten += kachel(a, verBadge(a), nameTreffer ? ''
      : `<ul class="punkte">${zeilen.map(([tag, t]) => `<li>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}${esc(t)}</li>`).join('')}</ul>`, zuApp(a), nameTreffer ? a.kurz : '');
  }
  return karten ? `<div class="raster">${karten}</div>` : '';
}

/* ---------- Zeichnen ---------- */
let zustand = { ansicht: 'woche', woche: WOCHEN[0] && WOCHEN[0].key, app: LISTE[0].id };
let springen = null;
function ausHash() {
  const h = decodeURIComponent(location.hash.slice(1)); let m;
  if ((m = h.match(/^app=([\w-]+)$/)) && LISTE.some(a => a.id === m[1])) { zustand.ansicht = 'app'; zustand.app = m[1]; }
  else if (h === 'app') zustand.ansicht = 'app';
  else if ((m = h.match(/^woche=([\w-]+)$/)) && WOCHEN.some(w => w.key === m[1])) { zustand.ansicht = 'woche'; zustand.woche = m[1]; }
  else if (h === 'finden') { const f = $('#finden'); if (f && !f.hidden) { f.open = true; springen = '#finden'; } }
  else { zustand.ansicht = 'woche'; zustand.woche = WOCHEN[0] && WOCHEN[0].key; }
}
const eingabe = $('#suche');
function zeichne() {
  const worte = suchWorte(eingabe.value), sucht = worte.length > 0;
  $('#steuer').hidden = sucht;
  $('#brauche').hidden = sucht || !offen.length;
  $('#um-woche').setAttribute('aria-pressed', zustand.ansicht === 'woche');
  $('#um-app').setAttribute('aria-pressed', zustand.ansicht === 'app');
  $('#wochen').hidden = zustand.ansicht !== 'woche';
  $('#appwahl').hidden = zustand.ansicht !== 'app';
  $('#wochen').querySelectorAll('.wo').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === zustand.woche));
  $('#appwahl').querySelectorAll('.aw').forEach(b => b.setAttribute('aria-pressed', b.dataset.a === zustand.app));
  const html = sucht ? zeichneSuche(worte) : zustand.ansicht === 'app' ? zeichneApp() : zeichneWoche();
  $('#inhalt').innerHTML = html;
  // Werkzeuge und Wege: bei der Suche nur, was passt
  let treffer = !!html;
  document.querySelectorAll('[data-such]').forEach(el => { const ok = !sucht || worte.every(x => el.dataset.such.includes(x)); el.hidden = !ok; if (ok && sucht) treffer = true; });
  const wz = $('#werkzeuge'); wz.hidden = !wz.querySelector('[data-such]:not([hidden])');
  const f = $('#finden'); if (WEGE_ZEIGEN) { f.hidden = !f.querySelector('[data-such]:not([hidden])'); if (sucht && !f.hidden) f.open = true; }
  $('#leer').style.display = sucht && !treffer ? 'block' : 'none';
  // Nach dem Umschalten: Ziel sichtbar machen (Umschalter nicht aus dem Blick verlieren)
  const ziel = springen && $(springen), mitte = !!springen && springen.includes('.bra'); springen = null;
  if (ziel) ziel.scrollIntoView({ block: mitte ? 'center' : 'start' });
  else if (!sucht && $('#steuer').getBoundingClientRect().top < 0) $('#steuer').scrollIntoView({ block: 'start' });
}

/* ---------- Einmal aufbauen: Brauche-Kasten, Knöpfe, Werkzeuge, Wege, Fuß ---------- */
const offen = LISTE.flatMap(a => liste(a.brauche, 9).map(t => [a, t]));
if (offen.length) {
  $('#brauche').innerHTML = `<h2><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v6"/><circle class="voll" cx="12" cy="16.7" r="1.3"/></svg>Brauche ich von dir</h2>
    <ul>${offen.map(([a, t]) => `<li><a href="#app=${esc(a.id)}" data-spring=".app-ansicht .bra" style="--h:${a.farbe}"><span class="b-app">${esc(a.chip || a.name)}</span><span class="b-tx">${esc(t.split(' – ')[0])}</span><span class="pf" aria-hidden="true">›</span></a></li>`).join('')}</ul>`;
}
$('#wochen').innerHTML = WOCHEN.map(w => `<button type="button" class="wo" data-w="${esc(w.key)}" aria-pressed="false"><b>${esc(w.name)}</b><small>${esc(w.datum)}</small></button>`).join('');
$('#appwahl').innerHTML = LISTE.map(a => `<button type="button" class="aw" data-a="${esc(a.id)}" aria-pressed="false" style="--h:${a.farbe}"><i></i>${esc(a.chip || a.name)}</button>`).join('');
$('#werkzeuge').innerHTML = WERKZEUGE.length ? `<h2>Werkzeuge</h2><p class="hinweis">Nur nötig, wenn ich darum bitte.</p>`
  + WERKZEUGE.map(w => `<div class="wz" style="--h:${w.farbe}" data-such="${esc(suchText(w.name + ' ' + (w.wofuer || '')))}"><a href="${esc(w.link)}">${esc(w.name)}</a><span>${esc(w.wofuer || '')}</span></div>`).join('') : '';
if (WEGE_ZEIGEN) {
  const pfad = s => `<ol class="pfad">${s.map(x => `<li><span class="taste">${esc(x)}</span></li>`).join('')}</ol>`;
  $('#wege-innen').innerHTML = `<p class="hinweis">Steht auch in der App unter ≡ Menü › Wo finde ich …? Grün „ab 4.83“: der Weg mit dem neuen Import-Knopf.</p><div class="wege">`
    + WEGE.map(w => `<div class="weg" data-such="${esc(suchText([w.titel, w.notiz, w.bisher.join(' '), (w.neu || []).join(' ')].join(' ')))}"><h3>${esc(w.titel)}</h3>
      <div class="zeile">${w.neu ? '<span class="wann">bisher</span>' : ''}${pfad(w.bisher)}</div>
      ${w.neu ? `<div class="zeile neu"><span class="wann neu">ab 4.83</span>${pfad(w.neu)}</div>` : ''}
      ${w.notiz ? `<p class="notiz">${esc(w.notiz)}</p>` : ''}</div>`).join('') + '</div>';
} else $('#finden').remove();
{
  const stand = [DATEN.apps && DATEN.apps.stand, DATEN.verlauf && DATEN.verlauf.stand].filter(Boolean).sort().pop();
  if (stand) { const [d, m] = tm(stand); $('#fuss').textContent = `Stand: ${d}.${m}.${stand.slice(0, 4)} · Die Versionen liest die Seite beim Öffnen frisch aus den Apps.`; }
}

/* ---------- Bedienung ---------- */
// Sofort neu zeichnen und den Schritt nur im Verlauf merken (Zurück-Geste geht über hashchange)
const geh = h => { eingabe.value = ''; if (location.hash.slice(1) !== h) history.pushState(null, '', '#' + h); ausHash(); zeichne(); };
document.addEventListener('click', e => {
  const s = e.target.closest('[data-spring]'); if (s) springen = s.dataset.spring;
  const l = e.target.closest('a[href^="#"]'); if (l) { e.preventDefault(); geh(l.getAttribute('href').slice(1)); }
  const b = e.target.closest('button[data-geh]'); if (b && b.dataset.geh) geh(b.dataset.geh);
  const w = e.target.closest('.wo'); if (w) geh('woche=' + w.dataset.w);
  const a = e.target.closest('.aw'); if (a) geh('app=' + a.dataset.a);
});
$('#um-woche').addEventListener('click', () => geh('woche=' + zustand.woche));
$('#um-app').addEventListener('click', () => geh('app=' + zustand.app));
addEventListener('hashchange', () => { ausHash(); zeichne(); });
eingabe.addEventListener('input', zeichne);
ausHash(); zeichne();

// Hell / Dunkel: Auto → Hell → Dunkel (pro Gerät gemerkt)
const THEMEN = ['auto', 'light', 'dark'], NAME = { auto: 'Auto', light: 'Hell', dark: 'Dunkel' };
let thema = 'auto';
try { thema = localStorage.getItem('uebersicht.thema') || 'auto'; } catch (e) {}
const setzeThema = t => {
  thema = THEMEN.includes(t) ? t : 'auto';
  if (thema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', thema);
  $('#thema').textContent = NAME[thema];
};
setzeThema(thema);
$('#thema').addEventListener('click', () => { setzeThema(THEMEN[(THEMEN.indexOf(thema) + 1) % 3]); try { localStorage.setItem('uebersicht.thema', thema); } catch (e) {} });

// Versionen frisch aus den Apps lesen – erst nach dem Zeichnen, klein (kopf: nur die ersten 16 KB), Fehler = bekannte Version bleibt
async function liesVersion(a) {
  const q = a.quelle;
  if (!q) return;
  try {
    const r = await fetch(q.url, { cache: 'no-cache', headers: q.kopf ? { Range: 'bytes=0-16383' } : {} });
    if (!r.ok) return;
    const m = (await r.text()).match(q.muster);
    if (!m) return;
    FRISCH[a.id] = (q.vor || '') + m[1];
    document.querySelectorAll(`[data-ver="${a.id}"]`).forEach(el => { el.textContent = FRISCH[a.id]; el.title = 'frisch gelesen'; el.dataset.frisch = '1'; });
  } catch (e) { /* offline oder gesperrt: bekannte Version bleibt stehen */ }
}
const spaeter = window.requestIdleCallback || (f => setTimeout(f, 300));
spaeter(() => LISTE.forEach(liesVersion), { timeout: 1500 });
</script>
