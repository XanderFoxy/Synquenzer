# Krypto-Gewinn-Wecker: alle 30 Minuten Kurs von Bitcoin/Ethereum (Euro) gegen Xanders Einstiegspreis prüfen und EINMAL
# per ntfy melden, wenn ein Coin in den Gewinn dreht. Code: krypto/. Merk-Zustand (nur ja/nein + Datum): Zweig krypto-daten.
# Einstiegspreise stehen NUR in den Secrets BTC_EINSTIEG / ETH_EINSTIEG (optional BTC_SCHWELLE_PROZENT / ETH_SCHWELLE_PROZENT).
# Fehlen sie, endet der Lauf nach wenigen Sekunden ohne Abruf.
name: Krypto-Wecker

on:
  schedule:
    - cron: '11,41 * * * *'   # alle 30 Minuten (läuft nur vom Standardzweig aus)
  workflow_dispatch:
    inputs:
      probe:
        description: 'Nur prüfen, keine Push-Nachricht senden, nichts speichern'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: krypto
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Einstiegspreise hinterlegt?
        id: an
        env:
          BTC_EINSTIEG: ${{ secrets.BTC_EINSTIEG }}
          ETH_EINSTIEG: ${{ secrets.ETH_EINSTIEG }}
        run: |
          if [ -z "${BTC_EINSTIEG}${ETH_EINSTIEG}" ]; then
            echo "Keine Einstiegspreise hinterlegt (Secrets BTC_EINSTIEG / ETH_EINSTIEG) – nichts zu tun."
            echo "an=0" >> "$GITHUB_OUTPUT"
          else
            echo "an=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.an.outputs.an == '1'
        with:
          fetch-depth: 1
          sparse-checkout: krypto

      - uses: actions/setup-node@v4
        if: steps.an.outputs.an == '1'
        with:
          node-version: 22

      - name: Tests
        if: steps.an.outputs.an == '1'
        working-directory: krypto
        run: npm test

      - name: Daten-Zweig holen (oder neu anlegen)
        if: steps.an.outputs.an == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" krypto-daten >/dev/null; then
            git clone --quiet --depth 1 --branch krypto-daten "$URL" daten
          else
            mkdir daten && git -C daten init --quiet -b krypto-daten && git -C daten remote add origin "$URL"
          fi

      - name: Kurs prüfen und benachrichtigen
        if: steps.an.outputs.an == '1'
        env:
          BTC_EINSTIEG: ${{ secrets.BTC_EINSTIEG }}
          ETH_EINSTIEG: ${{ secrets.ETH_EINSTIEG }}
          BTC_SCHWELLE_PROZENT: ${{ secrets.BTC_SCHWELLE_PROZENT }}
          ETH_SCHWELLE_PROZENT: ${{ secrets.ETH_SCHWELLE_PROZENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DRY_RUN: ${{ inputs.probe && '1' || '0' }}
        run: node krypto/wecker.mjs --zustand daten/krypto/zustand.json

      - name: Zustand speichern (nur wenn sich etwas geändert hat)
        if: ${{ steps.an.outputs.an == '1' && !inputs.probe }}
        working-directory: daten
        run: |
          git config user.name "krypto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Merk-Zustand des Krypto-Weckers\nNur „im Gewinn: ja/nein“ und wann gemeldet – keine Preise. Code: Ordner krypto/.\n' > README.md
          git add -A
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          # Ein einziger Commit -> der Zweig bleibt klein
          git checkout --quiet --orphan neu
          git commit --quiet -m "Zustand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force origin neu:krypto-daten
