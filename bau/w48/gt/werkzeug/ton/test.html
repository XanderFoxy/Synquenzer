<!doctype html><meta charset="utf-8"><title>ton-test</title><body>
<script type="module">
import * as T from '../../app/js/ton.js';
const SR = 48000;
function goertzel(x, f, sr) { const w = 2*Math.PI*f/sr, c = 2*Math.cos(w); let s1=0,s2=0; for (let i=0;i<x.length;i++){const s0=x[i]+c*s1-s2; s2=s1; s1=s0;} return Math.sqrt(s1*s1+s2*s2-c*s1*s2)/x.length*2; }
function huelle(x, f0, sr) { const h=[]; for (let k=1;k*f0<4500;k++) h.push({f:k*f0, a:20*Math.log10(goertzel(x,k*f0,sr)+1e-9)}); return h; }
function spitze(h, lo, hi) { let b=null; for (const e of h) if (e.f>=lo && e.f<=hi && (!b || e.a>b.a)) b=e; return b && Math.round(b.f); }
async function render(fn, dauer) { const oc = new OfflineAudioContext(1, Math.round(SR*dauer), SR); fn(oc); const b = await oc.startRendering(); return b.getChannelData(0); }
const erg = {};
try {
  for (const v of ['a','i','u','e','o']) {
    const x = await render(oc => T.vokalStimme(oc, {vibrato:0}).singe(v, 48, 0, 1.0), 1.1);
    const seg = x.subarray(Math.round(0.3*SR), Math.round(0.8*SR));
    const h = huelle(seg, T.midiZuHz(48), SR);
    let pk = 0, rms = 0; for (const s of x) { pk = Math.max(pk, Math.abs(s)); rms += s*s; }
    erg['vokal_'+v] = { F1: spitze(h, 200, 900), F2: spitze(h, v==='a'?1000:(v==='o'||v==='u')?550:1500, v==='a'?1600:(v==='o'||v==='u')?1000:2700), spitze: +pk.toFixed(3), rms: +Math.sqrt(rms/x.length).toFixed(3) };
  }
  // Diphthong Ai: F2 am Anfang vs. Ende
  const x = await render(oc => T.vokalStimme(oc, {vibrato:0}).singe('a', 50, 0, 1.2, 'i'), 1.3);
  const f0 = T.midiZuHz(50);
  const anf = huelle(x.subarray(Math.round(0.2*SR), Math.round(0.6*SR)), f0, SR), end = huelle(x.subarray(Math.round(1.08*SR), Math.round(1.14*SR)), f0, SR);
  erg.gleit_ai = { F2anfang: spitze(anf, 1000, 2700), F2ende: spitze(end, 1000, 2700), F1anfang: spitze(anf,200,900), F1ende: spitze(end,200,900) };
  // hoher Ton mit Vibrato (F1 folgt dem Grundton)
  const xh = await render(oc => T.vokalStimme(oc).singe('i', 67, 0, 1.0), 1.1); const xt = await render(oc => T.vokalStimme(oc).singe('u', 40, 0, 1.0), 1.1); let pt=0; for (const s of xt) pt=Math.max(pt,Math.abs(s)); erg.tief_u_E2_spitze=+pt.toFixed(3);
  let pk=0; for (const s of xh) pk=Math.max(pk,Math.abs(s)); erg.hoch_i_G4_spitze = +pk.toFixed(3);
  // Klavier
  const xk = await render(oc => { const k = T.klavier(oc); k.spiele(60, 0, 0.6); k.spiele(64, 0.7, 0.6); }, 1.6);
  const r = (a,b) => { let s=0; for (let i=Math.round(a*SR);i<Math.round(b*SR);i++) s+=xk[i]*xk[i]; return +Math.sqrt(s/((b-a)*SR)).toFixed(4); };
  erg.klavier = { rms_0_01: r(0,0.1), rms_04_06: r(0.4,0.6), rms_068_07: r(0.68,0.7), rms_07_08: r(0.7,0.8) };
  // Tonhöhe der eigenen Vokal-Stimme zurückmessen (Hin-und-zurück)
  const xs = await render(oc => { const v = T.vokalStimme(oc); v.singe('o', 55, 0, 0.8); v.singe('e', 59, 0.9, 0.8); }, 1.8);
  erg.rueckmessung = T.melodieAusAudio(xs, SR).map(n => T.midiName(n.midi) + ' ' + n.dauer.toFixed(2));
  erg.rueck_silben = T.melodieAusAudio(xs, SR, [{t:0,dauer:0.8},{t:0.9,dauer:0.8}]).map(n => n.midi);
  // Worker
  const ton = new Float32Array(SR*2); for (let i=0;i<ton.length;i++) ton[i]=0.3*Math.sin(2*Math.PI*196*i/SR)+0.1*Math.sin(2*Math.PI*392*i/SR);
  const t0 = performance.now();
  const w = await T.imHintergrund('stimmlage', ton, SR);
  const hz = w.spur.hz.filter(h=>h>0).sort((a,b)=>a-b);
  erg.worker = { ms: Math.round(performance.now()-t0), medianHz: +hz[hz.length>>1].toFixed(2), typ: w.stimme.typ, tief: w.stimme.tiefName };
  // Mikrofon (Chromium-Testgerät)
  const ev = [];
  const stop = await T.mikrofon({ onTon: e => ev.push(e) });
  await new Promise(r => setTimeout(r, 1500));
  stop();
  const sti = ev.filter(e => e.hz > 0);
  erg.mikrofon = { meldungen: ev.length, stimmhaft: sti.length, beispiel: sti.slice(0,3).map(e => [Math.round(e.hz), e.name, e.cent]) };
} catch (e) { erg.fehler = String(e && e.stack || e); }
window.ERG = erg;
</script>
