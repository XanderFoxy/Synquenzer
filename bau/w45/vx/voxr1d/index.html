/* the page panel: a raised chassis with the controls (§5.2 "mehr Haptik") */
#synthSheet .pg{background:linear-gradient(var(--chassis-2),var(--chassis));border:1px solid var(--panel-edge);border-radius:8px;box-shadow:inset 0 1px 0 var(--hi);padding:6px 6px 4px}
#synthSheet .sh-body{padding:6px 8px 6px}
/* rows */
.pgrow.segs{flex-wrap:nowrap}
.pgrow.segs .lgrp{flex:0 1 auto;min-width:0}
.pgrow .lgrp>.lbl{min-width:0}
.kn-row.k5{grid-template-columns:repeat(5,minmax(0,72px));gap:2px 0;justify-content:space-between}
.kn-row.k5 .knob{width:auto;min-width:0}
.kn-row.k5 .knob .kl{max-width:100%}
.knob.inert,.tgl.inert{opacity:.32;pointer-events:none}
/* Welle: icon + name; at < 390 px only the icon (the name is the title / LCD) */
.seg.wvn button{display:inline-flex;align-items:center;gap:4px;padding:0 8px;font-size:12px}
.seg.wvn .wi{font-size:17px;line-height:1}
.seg.foot button{min-width:46px;font-family:var(--font-num);font-size:13px}
.seg.ft button{min-width:0;padding:0 7px;font-size:11.5px;letter-spacing:.02em}
.oscro{flex:none;font:500 11.5px/18px var(--font-num);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
/* toggle (§2.4): LED + text */
.tgl{flex:none;height:36px;min-width:56px;padding:0 10px 0 8px;gap:7px;font:700 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}
.tgl .led{width:8px;height:8px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6);flex:none}
.tgl.on{color:var(--text)}
.tgl.on .led{background:var(--tc,var(--sel));box-shadow:0 0 6px var(--tc,var(--sel))}
.tgrow{gap:10px}
.tgrow .small{flex:1 1 0;min-width:0;line-height:1.2}
/* MIX: five faders (Osz 1–3, Sub, Rauschen) + Ausgang / Analog, Sub-Lage / Sub-Form below */
.mixtop{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch;justify-content:space-between}
.faders{flex:0 1 auto;display:flex;gap:2px;min-height:0}
.faders .fader{height:auto;min-height:104px;align-self:stretch}
.mixk{flex:none;display:flex;flex-direction:column;justify-content:space-around;gap:2px}
.mixgrp{flex:0 1 auto;display:flex;flex-direction:column;min-height:0;gap:1px}
.mixgrp>.faders{flex:1 1 auto}
.mixgrp>.mixg{flex:none;font-size:10px;line-height:12px;letter-spacing:.14em;text-align:center;color:var(--text-dim);border-bottom:1px solid var(--line);padding-bottom:1px}
.mixk .knob .kl{font-size:10px;letter-spacing:0;max-width:100%;overflow:visible;white-space:normal;line-height:11px;text-align:center}   /* V0b: „KLANG-PEGEL“ in full (breaks after the hyphen if needed) */
#drumSheet .dkitk .knob .kl{font-size:10px;line-height:11px;padding-top:1px;letter-spacing:0;max-width:76px;white-space:normal;text-overflow:clip;text-align:center;overflow:visible}   /* V0b: „GATE-RÜCKWEG“ in full (two lines) */
.dkitk .tgl.dpsel{width:76px;height:58px;font-size:9.5px;letter-spacing:.02em;line-height:1.1;text-align:center;white-space:normal}
.pg-osc-mix .pgrow.segs{flex-wrap:wrap;gap:6px 12px}
/* FILTER: the resonance LED „EIGENSCHW.“ (self-oscillation from 100 %) and the hint line */
.kled{position:absolute;top:15px;left:50%;transform:translateX(-50%);font:700 7px/1 var(--font-ui);letter-spacing:.08em;color:var(--text-faint);pointer-events:none;opacity:.0;transition:opacity .1s}
.kled.on{opacity:1;color:#ff6b4a;text-shadow:0 0 6px #ff6b4a}
.fhint{flex:none;min-height:16px;font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhint.on{color:var(--amber)}
.pg-filter-ctl .pgrow.segs{justify-content:space-between}
.lgrp.lq>.lbl{display:none}
/* XY: line at 100 % resonance */
.pg-filter-xy .xy{flex:1 1 auto;min-height:100px;height:auto;max-width:none}
.xy .r100{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,107,74,.55);pointer-events:none}
.xy.drag .pt{transform:scale(1.25)}
/* envelope editor (§5.3, analog-research/adsr-editor.js) */
.enved{flex:1 1 auto;min-height:64px;position:relative;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s);box-shadow:inset 0 1px 6px rgba(0,0,0,.8);overflow:hidden;touch-action:none}
.enved svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.enved-lane{fill:transparent}
.enved-lane:nth-child(4n+1){fill:rgba(255,255,255,.015)}
.enved-sep{stroke:rgba(255,255,255,.07);stroke-width:1;vector-effect:non-scaling-stroke}
.enved-lbl{fill:var(--text-faint);font:700 10px var(--font-ui);text-anchor:middle;letter-spacing:.1em}
.enved-fill{fill:var(--tc,var(--sel));opacity:.12}
.enved-line{fill:none;stroke:var(--tc,var(--sel));stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.enved-dot{fill:#14161a;stroke:var(--tc,var(--sel));stroke-width:2;vector-effect:non-scaling-stroke}
.enved-dot.on{fill:var(--tc,var(--sel))}
.enved-bub rect{fill:var(--sel)}
.enved-bub text{fill:var(--ink);font:700 11px var(--font-num)}
.seg.forms button{min-width:0;padding:0 8px;font-size:11.5px}
.pg-env .pgrow.segs .lgrp{flex:1 1 auto}
/* LFO page: preview, route chips */
.pgrow.lfok{flex-wrap:nowrap;gap:2px 8px;align-items:center}
.lfopv{flex:1 1 120px;max-width:150px;height:56px;background:var(--lcd);border:1px solid var(--panel-edge);border-radius:var(--r-s);box-shadow:inset 0 1px 6px rgba(0,0,0,.8);overflow:hidden}
.lfopv svg{width:100%;height:100%}
.lfopv .ax{stroke:rgba(255,255,255,.08);stroke-width:1}
.lfopv .lw{fill:none;stroke:var(--tc,var(--sel));stroke-width:1.6;opacity:.7;vector-effect:non-scaling-stroke}
.lfopv .ld{fill:var(--sel);filter:drop-shadow(0 0 3px var(--sel))}
.routes{display:flex;flex-wrap:wrap;gap:4px;min-width:0;align-items:center}
.rchip{height:30px;padding:0 9px;font:700 11px/1 var(--font-ui);color:var(--text);white-space:nowrap}
.rchip.wk{color:var(--text-dim);background:repeating-linear-gradient(135deg,#1c1f25 0 5px,#15171b 5px 10px)}
.lfohint{flex:none;font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* MOD tab (§9.3, WP3: list, slider, ✕, [+ Modulation]); the list scrolls on its label column only */
.pg-mod{gap:6px}
.modhead{flex:none;gap:10px;flex-wrap:nowrap}
.madd{height:40px;padding:0 14px;border-style:dashed;font:700 12px/1 var(--font-ui);letter-spacing:.06em;color:var(--text)}
.mxlist{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:5px;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-right:2px}
.modrow{flex:none;display:grid;grid-template-columns:62px minmax(0,1fr) minmax(96px,1.15fr) 40px;align-items:center;column-gap:7px;min-height:48px;padding:4px 4px 4px 6px;border-radius:8px;background:var(--chassis-2);border:1px solid var(--line)}
.modrow.hl{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.modrow .ms{height:40px;border-radius:6px;background:var(--chassis-3);font:700 11px/1.1 var(--font-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;touch-action:pan-y}
.modrow .ms i{width:24px;height:4px;border-radius:2px;background:var(--c)}
.modrow .md{min-width:0;display:flex;flex-direction:column;gap:2px;touch-action:pan-y}
.modrow .md b{font:700 12px/1.15 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modrow .md small{font:500 10.5px/1.1 var(--font-num);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modrow .md em{font:700 9px/1 var(--font-ui);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.modrow .md em.idle{color:var(--text-dim);text-transform:none;letter-spacing:.01em;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modrow .md em[hidden],.modrow .md small[hidden]{display:none}
@media (orientation:portrait){.modrow .md em.idle:not([hidden]){white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15}}
@media (orientation:portrait) and (max-width:360px){.modrow .md em.idle:not([hidden]){-webkit-line-clamp:3}}
.modrow.idle .bsl b{opacity:.45}
.modrow .md em.idle.fest{text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
.lcd.fest{cursor:pointer}
.lcd.fest .lm{color:var(--text-dim);font:600 10px/1.1 var(--font-ui);white-space:normal;overflow:hidden;flex:1 1 auto;min-width:0;max-height:24px}
.lcd .lx.lfest{background:var(--text-dim);color:var(--ink)}
.knob.kidle svg,.fader.kidle .ftrack{opacity:.5}.knob.kidle .kn,.fader.kidle .kn{color:var(--text-dim)}
.modrow.wk{background:repeating-linear-gradient(135deg,#1c1f25 0 6px,#17191e 6px 12px)}
.bsl{position:relative;height:36px;touch-action:none;border-radius:6px;background:#0b0c0e;box-shadow:inset 0 1px 4px #000;overflow:hidden}
.bsl::before{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:1px;background:var(--text-faint)}
.bsl b{position:absolute;top:12px;bottom:12px;left:50%;width:0;background:var(--c);border-radius:2px}
.bsl span{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;font:600 11px/1 var(--font-num);color:var(--text);pointer-events:none}
.bsl .lim{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.55);pointer-events:none}
.bsl .lim.l{left:0}.bsl .lim.r{right:0}
.modrow .mx{height:40px;width:40px;font-size:15px;color:var(--text-dim)}
.mempty{color:var(--text-dim);font-size:12.5px;line-height:1.45;padding:12px 6px;text-align:center}
.mcnt{margin-left:auto}
/* [+ Modulation] popover */
.pop .msrc,.pop .mdst{grid-template-columns:repeat(3,minmax(0,1fr))}
.pop .msrc button,.pop .mdst button{min-width:0;white-space:normal;line-height:1.15}
.pop .mdst{grid-template-columns:repeat(2,minmax(0,1fr))}
.pop .mdst button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px}
.pop .mdst button small{margin-top:0}
@media (orientation:portrait) and (max-width:359px){ .pop .msrc button,.pop .mdst button{font-size:12px;padding-left:4px;padding-right:4px} }
@media (orientation:landscape){
  .pop .msrc,.pop .mdst{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pop .mdst button,.pop .msrc button{min-height:36px;height:auto;padding-top:4px;padding-bottom:4px}
  .pop .mgrp{margin-top:4px}
}
.pop .msrc button{position:relative;padding-left:12px}
.pop .msrc button i{position:absolute;left:5px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--c)}
.pop .mdst button.wk{color:var(--text-dim)}
.pop .mdst button small{display:block;font:600 8.5px/1 var(--font-ui);letter-spacing:.06em;color:var(--amber);margin-top:2px}
.pop .mdst button.on{border-color:var(--sel)}
.mgrp{margin-top:6px}
.mgrp .lbl{display:block;margin:0 0 4px 2px}
/* FX page: the bus hint chip */
.chip.bush{height:36px;color:var(--amber);border-color:#6b4c16;background:rgba(255,178,46,.08)}
/* Sichern popover */
.pop .tin{width:100%;max-width:300px;height:44px;margin:4px 0 8px;display:block}
.savrow{display:flex;gap:8px;justify-content:flex-end}
.savrow .mbtn{min-width:96px}
/* MK8: place choice (Sichern / WRITE, Bank ▾): 44 px keys, 4 columns on narrow phones, 8 from 400 px */
.pop.mk8w{width:min(440px,calc(100vw - 16px))}
.pop.mk8w .mk8g{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin:0 0 6px}
.pop.mk8w .mk8g button{min-height:44px;height:44px;padding:0;font:700 14px/1 var(--font-num);color:var(--text)}
.pop.mk8w .mk8g button.on{border-color:var(--sel);box-shadow:inset 0 0 0 2px var(--sel);color:var(--sel)}
.pop.mk8w .mk8sl button.own::after{content:'•';position:absolute;margin:-18px 0 0 18px;color:var(--amber)}
.pop.mk8w .mk8i{margin:2px 0 4px;min-height:30px;line-height:15px}
.pop.mk8w .mk8r{flex-wrap:wrap}.pop.mk8w .mk8r .mbtn{min-height:44px;min-width:0;flex:1 1 auto}
.pop.mk8w .tin{max-width:none}
@media (max-width:399px){.pop.mk8w .mk8g{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* ---------- sound browser (§11.2) ---------- */
/* placement: as every .sheet.ed (P: rows 2–4 over grid, strip and carrier; L/W: row 2 only, so the mode bar and the
   keyboard stay playable and a key press can stop a preview, §2.3 / §11.3) */
#sndSheet .br-head .r1{height:48px}
#sndSheet .br-head .sh-title{flex:0 .02 auto;min-width:0}   /* V0b: the head keeps its buttons on screen (the sound name gives way first) */
#sndSheet .brcur{flex:0 9 auto}
#sndSheet .br-head .r1:has(.abb:not([hidden])) .brpre{display:none}   /* with [A/B] shown: „SYNTH 2 · FM“ */
#sndSheet .brcur{min-width:0;flex:0 9 auto;font:600 12px/1 var(--font-ui);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:5px}
.brbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.brcats{flex:none;display:flex;gap:5px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--panel-edge)}
.brcats::-webkit-scrollbar{display:none}
.brcats .chip{flex:none;height:36px}
.brcats .cl{display:none}
.brmain{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.brlist{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 8px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 36px auto;align-items:center;gap:4px;min-height:48px;border-bottom:1px solid #1d2026}
.brow.cur{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--tc,var(--sel));border-radius:7px}
.brow .bpv{width:44px;height:48px;font-size:15px;color:var(--play)}   /* V0b U-01: ▶ = preview, 44 × 48 at the left of the row */
.brow .bpv.on{background:rgba(53,208,127,.10)}
/* V0b EN-04: [FM ▾ │ Alle Engines] before the role chips */
.brseg{flex:none;display:flex;border-radius:var(--r-s);box-shadow:0 0 0 1px var(--line)}
.brseg .chip{border-radius:0;flex:none}
.brseg .chip:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.brseg .chip:last-child{border-radius:0 var(--r-s) var(--r-s) 0}
.brseg .chip.on{color:var(--text)}
.brcats .brseg{margin-right:4px;position:sticky;left:0;z-index:2;background:var(--chassis);box-shadow:0 0 0 1px var(--line),6px 0 8px -2px var(--chassis)}   /* the engine choice never scrolls out of view */
.brlist:not(.xeng) .brow .beng{opacity:.55}
.br-head .breng{color:var(--text-dim);letter-spacing:.04em}
.plist.breng{display:grid;grid-template-columns:repeat(3,minmax(56px,1fr));gap:6px}
.plist.breng button{height:44px;font:700 14px/1 var(--font-ui)}
.brow .bpv.on{color:var(--text);border-color:var(--play-dim)}
.brow .bmain{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;height:48px;justify-content:center;text-align:left;padding:0 4px}
.brow .bmain b{font:700 14px/1.1 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brow .bmain span{font:500 11px/1.1 var(--font-ui);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brow .beng{font:700 9px/1 var(--font-num);color:var(--text-faint);border:1px solid var(--line);border-radius:3px;padding:3px 4px}
.brow .binfo{width:36px;height:44px;font-size:15px;color:var(--text-dim)}
.brow.open .binfo{color:var(--sel)}
.brow .bmore{width:40px;height:40px;font-size:16px}
.brow .binfo,.brow .bmore{position:relative}
.brow .binfo::after{content:'';position:absolute;inset:0 -2px 0 -6px}
.brow .bmore::after{content:'';position:absolute;inset:-3px -4px -3px -2px}   /* MK8b: hit area 44 x 44 without changing the look (typische Fehler A4) */
.brow .bmain span.bkp{white-space:normal;text-overflow:clip}   /* G-MK8b-merge (A1): two lines where needed (genre │ „NN · Rolle“), never „…“ */
.brow .bmain span.bkp i{font-style:normal;white-space:nowrap}
/* G-MK8b-merge-fix (MK8b-06, ≥ 44 × 44): EVERY chip of the library row (engine segment, Bank ▾, Micro, „Alle …“, roles, 8 genre tabs)
   hits on the full row height and 4 of the 5 px gap on its left (only to the left, so scrollWidth stays = clientWidth, typische Fehler
   A1: Init 40 → 44 px) – invisible ::before, insets from the padding box (1 px border):
   P1 6 + 36 + 6 = 48 px, P2/P3 6 + 32 + 6 = 44 px (row padding 4 → 6, the row 4 px taller); the joined segment keys only up to their seam.
   Quer (column): 12 px between the 32 px chips = 44 px pitch, the segment keys 44 px high; head and footer keys see below. */
.brcats .chip{position:relative}
.brcats .chip::before{content:'';position:absolute;left:-5px;right:0;top:-7px;bottom:-7px}
.brcats .brseg .chip::before{left:-1px;right:0}
#sndSheet .br-head .r1 .hb,#sndSheet .br-head .r1 .sh-x,#sndSheet .brfoot .mbtn{position:relative}
#sndSheet .br-head .r1 .hb::after,#sndSheet .br-head .r1 .sh-x::after,#sndSheet .brfoot .mbtn::after{content:'';position:absolute;left:min(0px,calc(100% - 44px));right:0;top:min(0px,calc(50% - 22.5px));bottom:min(0px,calc(50% - 22.5px))}   /* 45 px high centred; at least 45 px wide, only to the left (A/B 37 → 45: into the sound name / the 5 px gap; A1) */
#sndSheet .brfoot .mbtn::after{top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}   /* P2/P3: 4 + 36 + 4 = 44, exactly the footer padding */
@media (orientation:landscape){#sndSheet .br-head .r1 .hb::after,#sndSheet .br-head .r1 .sh-x::after{top:-4px;bottom:-8px}.brow .bmore::after{top:-2px;bottom:-4px}.brlist{padding-top:0;margin-top:4px}}   /* quer: 34 px keys in the 40 px head – from the head's top edge (never into the app bar) into the list's empty 4 px top padding = 44 px; the row's ⋯ (40 px in the 44 px row) then hits 2 px down instead of up, still 44 px, and the list's 4 px top gap is a margin (looks the same) so scrolled rows never slide under that strip */
.btip{font:500 12.5px/1.4 var(--font-ui);color:var(--text);padding:6px 8px 10px 48px;border-bottom:1px solid #1d2026}
.bacts{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 10px 48px;border-bottom:1px solid #1d2026;align-items:center}
.bacts .tin{flex:1 1 140px;height:40px;min-width:0}
.brfoot{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;border-top:1px solid var(--panel-edge);align-items:center}
.brfoot .mbtn{height:40px}
@media (orientation:portrait){
  .brfoot{flex-wrap:wrap;gap:5px}
  .brfoot>.mbtn{flex:1 1 0;min-width:0;padding:0 6px}
  .brfoot>.bush{flex:1 1 100%;justify-content:center}
}
@media (orientation:portrait) and (max-height:700px){
  .brfoot{padding:4px 8px}
  .brfoot .mbtn{height:36px;font-size:12px}
  .brfoot .chip.bush{height:32px}
  .brcats{padding:6px 8px}
  .brcats .chip{height:32px}
}
.brdl{flex-basis:100%}
.brdl[hidden]{display:none}
@media (orientation:portrait) and (max-height:700px){
  .sh-subs{height:30px;padding-bottom:3px}
  .stab{height:26px}
  .oscro{line-height:16px}
  .kn-row .knob{height:86px}
  .tgl{height:34px}
}
@media (orientation:portrait) and (max-height:600px){
  .sh-subs{height:28px}
  .stab{height:24px;font-size:10.5px}
  .oscro{font-size:10.5px;line-height:14px}
  .kn-row .knob{height:78px}
  #synthSheet .pg{padding:4px 5px 3px}
  .lfopv{height:44px}
  .modrow{min-height:44px}
}
/* P: the six editor tabs show their whole label („FILTER“, „HÜLLK.“ were cut by the letter spacing) */
@media (orientation:portrait){ .tab{padding:0 3px;letter-spacing:.03em} }

  .pg-filter-ctl .pgrow.segs{justify-content:flex-start}

  .pg-lfo-l1,.pg-lfo-l2{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;gap:4px 12px;align-content:start}

  .brcats{gap:12px;padding-bottom:6px}                    /* G-MK8b-merge-fix: 32 + 12 = 44 px pitch, every chip hits 44 high (::before 6 px into each gap) */
  .brcats .chip::before{left:-1px;right:0;top:-7px;bottom:-7px}
  .brcats .brseg .chip{height:44px}                        /* the joined engine keys cannot share a gap: 44 px each */
  .brcats .brseg .chip::before{top:-1px;bottom:-1px}

/* ---------- FM tab (§6.5, WP7): ALGO · OP · MAKRO ---------- */
.fmdiag{flex:none;width:170px;height:150px;border-radius:8px;background:var(--lcd);box-shadow:inset 0 1px 5px rgba(0,0,0,.9);border:1px solid var(--panel-edge);touch-action:none;display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}
.fmdiag svg,.athumb svg{width:100%;height:100%;display:block;overflow:visible}
svg.alg .w{fill:none;stroke:#6b7280;stroke-width:1.5}
svg.alg .fb{fill:none;stroke:#ff9b3d;stroke-width:1.6;stroke-linejoin:round}
svg.alg .fb.fb0{stroke:#7b828f;stroke-width:1px;stroke-dasharray:3 2}
.fmdiag{position:relative}
.fmdiag .fblbl{position:absolute;left:4px;right:4px;bottom:2px;font:700 9.5px/11px var(--font-ui);letter-spacing:.02em;color:#c98a4a;text-align:right;white-space:nowrap;overflow:hidden;pointer-events:none}

svg.alg .op.car text{fill:#0b0c0e}
svg.alg .op.off rect{fill:#15171b;stroke:#3a3f49;stroke-dasharray:3 2}
svg.alg .op.off text{fill:#5a606b}
svg.alg .op.car.off rect{fill:color-mix(in srgb,var(--tc,var(--sel)) 25%,#15171b)}
svg.alg .op.sel rect{stroke:#fff;stroke-width:2.6}
.fmtop{flex:none;display:flex;gap:10px;align-items:stretch;min-width:0}
.fmaside{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto;gap:4px 4px;align-content:start}
.fmaside>.fmcap{grid-column:1/-1;grid-row:1}

.fmaside>.fmname{grid-column:1/-1;grid-row:3}

.fmcap{padding-left:2px}

/* ---------- G-MK8b-merge-fix: Trefferflächen ≥ 44 × 44 auf dem Hauptbildschirm, in der Song-Ansicht und im ⋯-Menü des Klang-Editors
   (typische Fehler A4). Unsichtbar per ::before (Aussehen gleich): senkrecht centred 44 px, waagrecht wo möglich nur nach links (A1), nur
   in den freien Rand bzw. höchstens bis zur Mitte des Spalts – nie über eine Nachbar-Taste. Insets gelten ab der Padding-Box (1 px Rand). Wo die Zeile selbst kleiner als 44 px ist (quer die
   Spur-Zeilen nach §2.2, die Song-Spuren, die Modus-Wahl), geht es nicht unsichtbar: CHANGES-MK „Fragen an Xander“. ---------- */
#top > button,.stp,#partBar > button,.sv-top > button,#bHMode,#bLatch,#bOrig,#readout,#strip .sbtn,#modebar .oct{position:relative}
#top > button::before{content:'';position:absolute;left:max(-5px,min(0px,calc(100% - 43px)));right:0;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
.stp::before,.szb::before{content:'';position:absolute;top:0;bottom:0;left:max(-4px,min(0px,calc(100% - 43px)));right:min(0px,max(-2px,calc(100% - 41px)))}   /* the 3 px gap on the left, then 1 px into the free edge on the right */
#partBar > button::before{content:'';position:absolute;left:0;right:0;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
.sv-top > button::before{content:'';position:absolute;left:0;right:0;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
#bHMode::before,#bLatch::before,#bOrig::before,#readout::before{content:'';position:absolute;left:0;right:0;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
#strip .sbtn::before{content:'';position:absolute;top:0;bottom:0;left:max(-4px,min(0px,calc(100% - 43px)));right:0}
#modebar .oct::before{content:'';position:absolute;left:max(-4px,min(0px,calc(100% - 43px)));right:0;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
.pop .seg.mkqeng button::before{content:'';position:absolute;left:0;right:0;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
/* the song tool row clips its text (overflow:hidden), so a ::before cannot reach out: hochkant the row is 44 px high (was 40, the
   tracks below 4 px shorter); the readout clips like that too: its text lines clip themselves, the box lets the hit area out */
#songView:not(.side) .sv-top{height:44px}
#readout{overflow:visible}
#readout .l1,#readout .l2{overflow:hidden}
@media (orientation:landscape){
  #top{border-bottom:0;box-shadow:inset 0 -1px 0 var(--panel-edge),inset 0 -2px 0 var(--hi)}   /* same two lines, drawn inside: the bar's 44 px are all hit area (the border took 1 px of the clipped box: 43) */
  #partBar > button::before{top:-3px;bottom:-5px}                /* 38 px keys: 2 px up (the gap above), 4 px down (the empty strip edge) */
  #songView.side .sv-top{flex-basis:91px}                        /* the 2 tool columns 37 → 44 px (3 px gap); the tracks 15 px narrower */
  #songView.side .sv-top > button::before{content:none}
}
@media (orientation:landscape) and (max-height:560px){         /* the 40 px carrier rows with 3 px gaps: readout up to the bar, the gap shared */
  #readout::before{top:-4px;bottom:-2.5px}
  #bHMode::before,#bLatch::before,#bOrig::before{top:-2.5px;bottom:-3.5px}
}
@media (orientation:landscape) and (min-width:800px){          /* 41 + 3 px gap = 44 px pitch (was 40 + 3); the track name gives the 4 px */
  #strip #bEdit,#strip #bFolgt,#strip #bMute,#strip #bUndo{width:41px;min-width:41px}
}

.mtr.hz .h{top:0;bottom:0;left:0;width:1px;height:auto}

/* SX4-CSS-BEGIN – Spurkopf: S-Marke (Solo), gedimmt (nicht im Solo), stumm im Song, Lautstärke-Schieber im Kopf (absolut, nichts verschiebt sich) */

/* UIX1-CSS-BEGIN (Xander 07.11.): hochkant kein runder Lautsprecher mehr über dem Song (Schalter im Schleife-Blatt), jedes ✕ mit
   Trefferfläche ≥ 44 px (Aussehen bleibt), Popups mit Titel bekommen ein ✕ oben rechts (bleibt beim Scrollen stehen), Zeile „Neu“
   im Blatt „Teil überarbeitet“ (wie im Blatt „Teil gefangen“) */
.ux1-hd{display:none}
@media (orientation:portrait){

  .ue-tabs > .ue-x{position:sticky;right:0;z-index:1}   /* Übergänge: das ✕ scrollt nicht mit den Reitern aus dem Bild */
  .sheet .sh-x{z-index:1}   /* kleine iPhones (Kopfzeile 40 px): die Trefferfläche des ✕ geht vor die Taste darunter */
  #rollSheet .rhead .sh-x::after{bottom:-6px}   /* Noten-Editor: oben schneidet der Blattrand ab, unten liegt nur der Zusatz-Rand der Werkzeuge */
  .fsheet .fs-x::after,.psheet .ps-x::after{content:'';position:absolute;left:-3px;right:-3px;top:-3px;bottom:-3px}
  .crsheet .cr-x::after{content:'';position:absolute;left:-5px;right:-5px;top:-5px;bottom:-5px}

/* UX2-CSS-BEGIN – Paket UX2: Ziehen in der Matrix (Geist, Einfüge-Linie, Ziel, Zieh-Symbol), Einfügen mit Lupe im Noten-Editor */
.ux2gh{position:fixed;left:0;top:0;z-index:9000;margin:0;pointer-events:none;opacity:.95;transform-origin:0 0;will-change:transform;box-shadow:0 12px 28px rgba(0,0,0,.65),0 0 0 2px var(--amber);border-radius:var(--r-s,8px)}

.ux2gh.ux2c .ux2bd{color:var(--play)}

.ux2src{opacity:.35;outline:2px dashed var(--amber);outline-offset:-2px}

.ux2p-ov{position:absolute;inset:0;z-index:1;touch-action:none}
.ux2p-lupe{position:fixed;z-index:9500;border-radius:12px;border:2px solid var(--amber);box-shadow:0 10px 24px rgba(0,0,0,.7);pointer-events:none;background:#0d0e11}
.pr-bar .ux2p-lab{color:var(--amber)}
.pr-bar button.ux2pb{position:relative}.pr-bar button.ux2pb::after{content:'';position:absolute;left:0;right:0;top:-7px;bottom:-7px}   /* Trefferfläche ≥ 44 px wie die anderen Knöpfe der Leiste */

@media (max-width:419px){#drumSheet .sh-head .seg.ndiinst button{min-width:44px;padding:0 4px}#drumSheet .sh-head .hb.ndpk{min-width:50px;padding:0 4px;gap:3px}#drumSheet .sh-head .seg.ndiinst{gap:2px}}

<script type="text/plain" id="sq-sr-src">
/* ===== I1f (Nachtrag 8 B.1 6.7): block sq-sr-src, evaluated on first need (srLoad): the TILT logic ===== */
/*@@NEIGEN@@*/
/* ---- I1f TILT logic (Nachtrag 8 B.1 §6.7): permission, sensor check, exact tilt angle, thumb clutch. No visible part; the
   field of I1d calls tap() in its click handler, attach(el) on its button and open()/close() with the field. Never calls
   haptic() (A.8 H2). Position goes out through NEIGEN.hooks (I1c: srHand). ---- */
const NEIGEN = (() => {
  const TXT = {
    ok: 'Daumen halten und kippen',
    denied: 'Bewegung nicht erlaubt. Safari merkt sich das – Tab schließen und die Seite neu öffnen; hilft das nicht, Safari ganz beenden.',
    nosensor: 'Kein Bewegungssensor',
    iframe: 'Neigen geht nur auf der Webseite in Safari',
    noreply: 'Sensor antwortet nicht',
    asking: '', idle: ''};
  const D2R = Math.PI / 180, DEAD = 1.5, FULL = 30, TAU = 40, REF_BEFORE = 50, REF_WAIT = 300, PROBE = 500, SEND_MS = 1000 / 60;
  let st = 'idle', opened = false, listening = false, visL = false, nList = 0, probeT = 0;
  // rotation work space (no allocation per event)
  const Rr = new Float64Array(9), Rn = new Float64Array(9), last = new Float64Array(4);   // last valid event: alpha beta gamma time
  let hasLast = false, oriL = false;

  const work = new Float64Array(64); let wi = 0, wn = 0;

  const hooks = {
    _x: 0,
    get: () => (typeof R !== 'undefined' && R && R.sr && typeof srHand === 'function' ? +R.sr.x || 0 : hooks._x),   // I1c: the hand position
    hand: (x, phase) => { if (typeof srHand === 'function') srHand(x, 'neigen', phase); else hooks._x = x; }};

  // R = Rz(alpha) · Rx(beta) · Ry(gamma) (W3C, intrinsic Z-X'-Y''), row-major into out
  function rot(a, b, g, out) {
    a *= D2R; b *= D2R; g *= D2R;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
    out[0] = ca * cg - sa * sb * sg; out[1] = -sa * cb; out[2] = ca * sg + sa * sb * cg;
    out[3] = sa * cg + ca * sb * sg; out[4] = ca * cb; out[5] = sa * sg - ca * sb * cg;
    out[6] = -cb * sg;               out[7] = sb;      out[8] = cb * cg;

  // θ = atan2(−u'·z, u'·u) = angle of u' projected onto the plane normal to screen-right. Positive = top edge away from the body.
  function theta(Rref, Rnow, ang) {

  function send(phase) { const x = H.x; try { hooks.hand(x, phase); } catch (e) { if (typeof logErr === 'function') logErr(e); } cnt[phase]++; }

  }

    const a = fin(e.alpha) ? e.alpha : 0, b = e.beta, g = e.gamma;
    if (!fin(b) || !fin(g)) return;

      else {

        step(t);
      }

  }

  // carries the smoothing on to the last angle, so the position settles where the hand is
  function step(t) {
    const dt = Math.max(0, t - H.tPrev); H.tPrev = Math.max(H.tPrev, t);
    H.ths += (H.th - H.ths) * (1 - Math.exp(-dt / TAU));

      Promise.resolve(p).then(r => setSt(r === 'granted' ? 'ok' : 'denied'), () => setSt('denied'));

    st = 'asking';

  }

    if (!visL) { document.addEventListener('visibilitychange', onVis); visL = true; }

  }
  function close() {

  }

    if (!oriL) { oriL = true; try { if (screen.orientation) screen.orientation.addEventListener('change', oriChg); } catch (x) {} window.addEventListener('orientationchange', oriChg); }
    if (hasLast && H.tDown - last[3] <= REF_BEFORE && H.tDown - last[3] >= -REF_BEFORE) setRef(last[0], last[1], last[2], last[3]);
    else H.waitT = setTimeout(() => { if (H.on && !H.refOk) { H.on = false; H.pid = -1; st = 'noreply'; } }, REF_WAIT);
  }
  function up(e) { if (H.on && (e.pointerId === H.pid || H.pid < 0)) holdEnd(); }
  function attach(el) {
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
    return () => { el.removeEventListener('pointerdown', down); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.removeEventListener('lostpointercapture', up); };
  }
  function medianMs() { if (!wn) return 0; const a = Array.from(work.subarray(0, wn)).sort((p, q) => p - q); return a[wn >> 1]; }
  // 'noreply' is shown once; the next touch tries again
  function state() { return {st, txt: TXT[st] || '', listening, listeners: nList, holding: H.on, ref: H.refOk}; }
  const api = {
    TXT, hooks, rot, theta, mapX, tap, open, close, attach, state,
    ref: () => (H.refOk ? {R: Array.from(Rr), angle: H.ang, xRef: H.xRef} : null),
    angle: () => ({raw: H.th, smooth: H.ths, x: H.x}),
    info: () => ({listeners: nList, listening, opened, events: cnt.events, start: cnt.start, move: cnt.move, end: cnt.end, medianMs: medianMs()}),
    _reset: () => { close(); st = 'idle'; cnt.start = cnt.move = cnt.end = cnt.events = 0; wn = wi = 0; H.x = 0; hooks._x = 0; }};
  // a later state 'noreply' becomes 'ok' again on the next touch
  api.attach = el => { const off = attach(el); const re = () => { if (st === 'noreply') st = 'ok'; }; el.addEventListener('pointerdown', re, true); return () => { off(); el.removeEventListener('pointerdown', re, true); }; };
  return api;
})();
/*@@/NEIGEN@@*/
</script>
<script type="text/plain" id="sq-ndp-src">
/* ===== ND-P (Paket North-Platte): block sq-ndp-src, evaluated on first open (ndpLoad, Muster sq-mk-src). Das Instrument-Gesicht
   der Drum-Engine MD_NAME: rote Front, schwarze Beschriftungsfelder, Kanal-Tasten in zwei Bänken, 3-stelliges Siebensegment-Display,
   großes Rad, Sektionen TONE · NOISE · CLICK · MIX/FX mit Regler-Paaren (obere/untere Reihe wie am Gerät, §1.3–§1.9) und die
   Kit-Effekte HALL · ECHO (§1.10). Keine eigene Datenhaltung: jede Bedienung schreibt über dieselben Wege wie der North-Editor
   (mdSet, mdScl, mdKitSet, mdTap, soundSnapshot/commitSound auf DRUM_T) → slot.md und p.md, ein Undo je Geste.
   DOM + CSS (Block NDP-CSS), Siebensegment als SVG, keine Bilddaten, keine neue Schrift. ===== */
(function (G) {   // NPS: G = die globalen md-Wege der Drum-Spur (Aufruf am Blockende)
'use strict';
/* NPS (Xander 01.11.): Datenquelle umschaltbar – die Drum-Spur (wie bisher) oder eine Perkussionsspur Q.t (Synth-Spur mit North,
   sound.p.nk = {kit, ch[12], md}, Kanal Q.c). Adapter statt Kopie: die Namen hier verdecken in dieser Platte die gleichnamigen
   globalen md-Wege; ohne Perkussionsspur rufen sie genau diese (G) – die Drum-Spur verhält sich unverändert. Auf der Perkussionsspur
   schreibt jede Geste in nk.ch[c] bzw. nk.md (in place wie setP), ein Undo je Geste (soundSnapshot/commitSound auf DRUM_T = Ziel-Spur),
   der Klang geht sofort an den Knoten der Spur (percEngineSync → percSync, nur Geändertes). */
const Q = {t: -1, c: 0, sub: null, edV: -1, ed: false};
const QP = () => Q.t >= 0;
const qNk = () => (QP() && percIs(S.tracks[Q.t]) ? percNkOf(S.tracks[Q.t].sound) : null);

const ED = {get dVoice() { return QP() ? Q.c : G.ED.dVoice; }, set dVoice(v) { if (QP()) Q.c = clamp(v | 0, 0, 11); else G.ED.dVoice = v; }};

const mdCur = () => { if (!QP()) return G.mdCur(); const nk = qNk(); return (nk && nk.ch[Q.c]) || MDN.init(); };
const mdIsSrc = id => (QP() ? !!qNk() : G.mdIsSrc(id));            // Perkussionsspur: jeder Kanal spielt North
const mdUsed = () => (QP() ? !!qNk() : G.mdUsed());
const mdSlot = id => { if (!QP()) return G.mdSlot(id); const nk = qNk(), v = DRUM_BY_ID[id], s = nk && v ? nk.ch[v.idx] : null; return s ? Object.assign({}, s, {src: 'md'}) : null; };   // nur Lesesicht
const mdKit = () => (QP() ? Object.assign(MDN.kitInit(), (qNk() || {}).md || {}) : G.mdKit());
const mdSet = (key, v) => (QP() ? qSet(key, v) : G.mdSet(key, v));
const mdScl = code => (QP() ? qScl(code) : G.mdScl(code));
const mdKitSet = (k, v) => (QP() ? qKitSet(k, v) : G.mdKitSet(k, v));
const mdLoadProgram = (id, prog, name) => (QP() ? qProg(DRUM_BY_ID[id].idx, prog, name) : G.mdLoadProgram(id, prog, name));
const mdProgPop = anchor => (QP() ? percProgPop(anchor, Q.t, Q.c) : G.mdProgPop(anchor));
const mdList = (key, anchor) => (QP() ? qList(key, anchor) : G.mdList(key, anchor));
const mdTap = btn => (QP() ? qTap(btn) : G.mdTap(btn));
const drumAudition = (idx, vel) => (QP() ? percHit(Q.t, idx, vel) : G.drumAudition(idx, vel));
const mdAudition = force => { if (!QP()) return G.mdAudition(force); if (R.playing && !force) return; const t = performance.now(); if (!force && t - MDE.aud < 300) return; MDE.aud = t; percHit(Q.t, Q.c, .8); };
const mdSoloApply = () => { if (!QP()) return G.mdSoloApply(); const E = percE(Q.t), s = MDE.sub; if (E) E.mute(MDE.solo ? Q.c : -1, MDE.solo ? (s === 'tone' || s === 'noise' || s === 'click' ? s : 'all') : null); };
const mdHeadSolo = () => (QP() ? null : G.mdHeadSolo());
const mdFocus = () => (QP() ? null : G.mdFocus());
const mdEditEnd = closing => { if (!QP()) return G.mdEditEnd(closing); if (!MDE.all && !MDE.solo && !MDE.rel) return; MDE.all = MDE.solo = MDE.rel = false; MDE.scl = ''; const E = percE(Q.t); if (E) E.mute(-1, null); };
const drumSnd = () => { if (!QP()) return G.drumSnd(); const k = (qNk() || {}).kit || ''; return {name: k || MD_NAME, origin: 'pk:' + k, pk: 1}; };   // Lesesicht: das Kit der Spur
const soundEdited = s => (s && s.pk ? qEdited() : G.soundEdited(s));
const kitId = n => (QP() ? 'pk:' + n : G.kitId(n));
const loadKit = n => (QP() ? qLoadKit(n) : G.loadKit(n));
// Quelle binden (open) und lösen (close): o.perc = Spur, o.c = Kanal; der Drum-Editor behält seine Unterseite (MDE.sub)
function qBind(o) {
  const t = o.perc != null && percIs(S.tracks[o.perc]) && percNkOf(S.tracks[o.perc].sound) ? o.perc | 0 : -1;
  if (P.open && t !== Q.t) mdEditEnd(true);

  Q.t = t; if (o.c != null) Q.c = clamp(o.c | 0, 0, 11);
  if (o.sec && SEC_BY[o.sec]) { P.sec = o.sec; P.enc = 'val'; secFocus(); MDE.sub = o.sec === 'kit' ? 'mix' : o.sec; }   // Sektion von Seite NORTH: Rad + Display auf ihren ersten Regler
  DRUM_T = t; MD_KIT_NAMES = percKits().map(k => k.name); P.root.classList.add('ndpperc');
}
function qUnbind(quiet) {
  if (!QP()) return; const t = Q.t;
  PERCUI.ch = Q.c; if (Q.sub) MDE.sub = Q.sub; Q.sub = null;
  Q.t = -1; DRUM_T = G.DRUM_T; MD_KIT_NAMES = G.MD_KIT_NAMES; if (P.root) P.root.classList.remove('ndpperc');
  if (!quiet && R.editor === 'synth' && R.selT === t) safeRebuild(buildSynthEd);   // zurück auf Seite NORTH mit den neuen Werten

.ndpzc .zl{max-width:100%;padding:3px 6px;border-radius:5px;background:#0d0d0e;font:800 10px/1.1 var(--font-ui);letter-spacing:.05em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ndpzc .zl em{display:block;font:700 10px/1.1 var(--font-num);font-style:normal;color:var(--ndp-amb)}
.ndpkcol{display:flex;flex-direction:column;gap:6px;justify-content:center;flex:1 1 0;min-width:0;max-width:150px}
.ndpzoomtag{position:absolute;right:4px;top:-2px;font:800 9px/1 var(--font-ui);letter-spacing:.12em;color:rgba(255,255,255,.75)}
/* Spiel-Ansicht */
.ndpsp{height:100%;box-sizing:border-box;display:grid;gap:8px;grid-template-rows:auto minmax(0,1fr);border-radius:14px;padding:8px;
  background:linear-gradient(180deg,var(--ndp-red),var(--ndp-red2));box-shadow:inset 0 0 0 2px hsl(355 70% 22%)}
.ndpsp .sptop{display:flex;align-items:center;gap:8px}
.ndpsp .ndpseg{height:52px;flex:none}
.ndpsp .ndpstrip{flex:1 1 auto;min-width:0}
.ndpsp .pads{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0}
.ndpq .ndpsp .pads{grid-template-columns:repeat(6,minmax(0,1fr))}
.ndppad{position:relative;min-height:44px;border-radius:10px;border:1px solid #050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px;box-sizing:border-box;
  background:linear-gradient(180deg,#2c2d31,#121315);box-shadow:0 3px 0 #050505,inset 0 1px 0 rgba(255,255,255,.12);color:#fff;font:800 13px/1.1 var(--font-ui);letter-spacing:.05em;overflow:hidden}
.ndppad small{font:600 10px/1.1 var(--font-ui);color:#c9c2ba;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ndppad .led{width:22px;height:6px;border-radius:3px;background:#3a0b07}
.ndppad.sel{box-shadow:0 3px 0 #050505,0 0 0 2px #fff}
.ndppad.md .led{background:#8c1d10}.ndppad.hit .led{background:#fff;box-shadow:0 0 10px #fff}
.ndppad.dr{color:#aaa}
@media (prefers-reduced-motion:reduce){.ndpk .rot,.ndpenc .rot{will-change:auto}}

// K1 (Mod-Übersicht, Tipp): the value of a path ('t.1.p.2.i') on screen: its timbre, the GERÄT plate zoomed to the section of
// its knob (if the plate has one) and the EDIT page that holds it (SEITEN-SPRUNG), the value on the LCD
function k1JumpPath(path) {
  const m = /^t\.([01])\./.exec(path); if (m) P.tim = +m[1] === 1 && dualOn() ? 2 : 1;
  const rel = m ? 't.0.' + path.slice(4) : path;
  if (P.view) viewClose();
  if (P.tab !== 'geraet') tabTo('geraet');
  const e = ELS.find(x => x.act && bindOf(x.id) === path), pg = pageOf(rel);
  if (pg) { P.mode = 'edit'; goPage(pg[0], pg[1]); }
  if (e && e.halt) { zoomTo(e.halt, true); P.lastKnob = defOf(e.id); }
  renderSoon(); const d = pg ? curItem() : P.lastKnob; if (d) lcdOf(d);
  return {halt: e ? e.halt || null : null, page: pg ? pg[0] : null};
}

  T: [["Zwei leicht verstimmte Sägen, die Filter-Hüllkurve schnappt kurz auf – kurze Akkorde auf der Zählzeit.",
      "Puls und eine Oktave Rechteck darüber, kurz gezupft; der Arp läuft aufwärts über zwei Oktaven, das Echo im punktierten Achtel.",
      "Langsam einschwingende Sägen, ein träger LFO öffnet den Filter ein wenig; das Ensemble macht es breit.",
      "Säge mit kurzer Filter-Hüllkurve: rund unten, aber mit genug Obertönen, damit man ihn auch am Handy hört.",
      "Einstimmige Säge mit kleinem Gleiten; das MOD-Rad bringt das Vibrato, das Echo setzt den Ton in den Raum.",
      "Eine Folge aus 16 Schritten öffnet und schließt das Filter im Sechzehntel – ein Ton genügt für eine ganze Figur.",
      "Sinus, von Oszillator 2 eine Duodezime höher verbogen; die Biegung klingt mit der Hüllkurve aus wie bei einer Glocke.",
      "Zwei Rechtecke im Oktavabstand mit Gate-Hüllkurve; der Chorus dreht schnell wie ein rotierender Lautsprecher.",
      "Puls mit einer Säge eine Oktave tiefer; der Filter bleibt dunkel, die Hüllkurve gibt nur einen kleinen Kick.",
      "Eine weiche Folge schiebt das Filter langsam auf und ab; halte einen Akkord und lass ihn atmen.",
      "Zwei Sägen, deren Form ein LFO bewegt, dazu das Ensemble – ein breiter Streicherteppich.",
      "Oszillator 2 ist hart an 1 gekoppelt; die Filter-Hüllkurve zieht seine Tonhöhe hoch und lässt sie fallen.",
      "Weicher Blechbläser-Einsatz: die Filter-Hüllkurve öffnet etwas verzögert, fester Anschlag macht heller.",
      "Speicherwellen im Sechzehntel: die Folge schaltet STEUER 2 von Welle zu Welle, das Echo verbindet sie.",
      "Säge mit resonanter, schnell zuschnappender Filter-Hüllkurve und Verzerrung – knackt bei jeder Note.",
      "Gefiltertes Rauschen; ein langsamer LFO fährt den Bandpass auf und ab. Lange Noten halten."],
    ["Ringmodulation gibt dem Akkord eine metallische Kante; kurzer Filter-Schlag.",
      "Heller Sinus mit Kreuzmodulation, der Arp springt abwechselnd hoch und runter; Echo im Achtel.",
      "Hochpass-gefilterte Sägen mit langsamem Einschwingen; der Phaser lässt die Fläche glitzern.",
      "Dreieck mit gefalteter Form und Gleiten zwischen gebundenen Noten – federnd und weich.",
      "Zwei Timbres in Schicht: eine Sync-Säge und eine weiche Dreieck-Stimme eine Oktave höher.",
      "Die Folge springt in Halbtönen und färbt dabei das Filter; der Ton tanzt über eine Oktave.",
      "Sinus mit starker Kreuzmodulation, schnell abklingend – wie ein angeschlagenes Kristallglas.",
      "Schmaler Puls mit kurzer Hüllkurve und Anschlagdynamik – eine helle, gezupfte Tastenstimme.",
      "Säge mit Ringmodulation eine Quinte darüber; der Filter zieht schnell zu – hart und knurrig.",
      "Zufällige Werte (S/H) und eine Folge bewegen den Bandpass – wie Funksignale aus der Ferne.",
      "Stimmwelle mit offenem Filter und Ensemble – ein heller, gehauchter Chor.",
      "Zwei Sägen mit Unisono-Stapel und hoher Resonanz – ein schneidender Lead mit Pfeifen im Filter.",
      "Weicher Dreieck-Synth mit Hochpass und langsamem Chorus – leise und durchsichtig.",
      "Speicherwellen im Wechsel, die Folge springt zwischen hellen Wellen; Kreuz-Echo.",
      "Sinus mit Kreuzmodulation als Bass – der Anschlag klingt hell, der Rest bleibt rund.",
      "Ringmodulator mit schnell wanderndem Oszillator 2 – zirpende Funkgeräusche."],
    ["Dunkle Säge mit Puls, die Filter-Hüllkurve geht weit auf – ein kräftiger Stab tief im Raum.",
      "Dunkler Puls, der Arp läuft abwärts über drei Oktaven; die Resonanz singt leise mit.",
      "Tiefpass auf zwei verstimmten Sägen, sehr langsam; Rauschen im Hintergrund macht es neblig.",
      "Zwei Sägen mit Unisono, tief gefiltert – ein dicker, brummender Bass.",
      "Rechteck-Lead mit hoher Resonanz und Gleiten; die Hüllkurve öffnet ihn beim Anschlag.",
