<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bildwerk</title>
<style>
  /* 0.7 Dunkelkammer: warmes Schwarz, Papierweiß, Bernstein wie Dunkelkammer-Licht; Masken in Rot. */
  :root {
    --grund: #0a0908; --bild-grund: #050504; --flaeche: #13110f; --flaeche2: #1c1915; --flaeche3: #26221c; --linie: #2e2924;
    --text: #efe8dc; --leise: #a39a8c; --akzent: #e2a64b; --akzent-dunkel: #33260f; --rot: #e0553f; --maske: rgba(224, 85, 63, .45);
    --tipp: 44px; --kopf: 54px; --reiter: 64px; --werkzeug: 58px; --regler: clamp(150px, 22vh, 230px);
    --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--grund); color: var(--text); overflow: hidden;
    overscroll-behavior: none; font: 15px/1.3 system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums;
    -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: var(--flaeche2); border: 1px solid var(--linie); border-radius: 12px;
    min-width: var(--tipp); min-height: var(--tipp); padding: 0 12px; touch-action: manipulation; }
  button[aria-pressed="true"] { border-color: var(--akzent); color: var(--akzent); }
  button:disabled { opacity: .35; }
  button.haupt { background: var(--akzent); color: #1a1206; border-color: var(--akzent); font-weight: 600; }
  button.breit { display: block; width: 100%; margin: 8px 0; }
  svg { flex: none; }
  .leise { color: var(--leise); font-size: 13px; }
  .platz { flex: 1; }

  /* ---------- Raster: Statuszeile · Bild · Werkzeuge · Regler · Modus-Leiste ---------- */
  #app { position: fixed; inset: 0; display: grid;
    grid-template: "kopf" calc(var(--kopf) + var(--st)) "bild" minmax(0, 1fr) "werkzeug" var(--werkzeug) "regler" var(--regler) "reiter" calc(var(--reiter) + var(--sb)) / 100%; }
  #kopf { grid-area: kopf; display: flex; align-items: center; gap: 2px; padding: var(--st) calc(6px + var(--sr)) 0 calc(6px + var(--sl)); background: var(--grund); border-bottom: 1px solid var(--linie); min-width: 0; }
  #kopf > button { padding: 0; width: 44px; display: inline-flex; align-items: center; justify-content: center; background: none; border-color: transparent; border-radius: 22px; }
  #kopf > button.haupt { background: var(--akzent); color: #1a1206; margin-left: 4px; }
  #kopf > button.haupt:disabled { background: none; color: var(--leise); border-color: var(--linie); }
  /* Ohne Foto: nur Statuszeile und Startfläche */
  #app.leer { grid-template: "kopf" calc(var(--kopf) + var(--st)) "bild" minmax(0, 1fr) / 100%; }
  #app.leer #werkzeug, #app.leer #regler, #app.leer #reiter { display: none; }
  .status { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .st-symbol { width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: var(--akzent); background: var(--akzent-dunkel); flex: none; }
  .st-symbol:empty { display: none; }
  .st-symbol svg { width: 18px; height: 18px; }
  .st-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .st-vor { font-size: 10.5px; color: var(--leise); letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-haupt { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.wert .st-haupt { color: var(--akzent); }
  #bildflaeche { grid-area: bild; position: relative; overflow: hidden; touch-action: none; background: var(--bild-grund); }
  #bild { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #werkzeug { grid-area: werkzeug; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 8px calc(10px + var(--sr)) 8px calc(10px + var(--sl)); border-top: 1px solid var(--linie); background: var(--grund); scrollbar-width: none; align-items: center; overscroll-behavior-x: contain; }
  #werkzeug::-webkit-scrollbar { display: none; }
  #werkzeug > * { flex: 0 0 auto; }
  #werkzeug button { border-radius: 22px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #werkzeug button[aria-pressed="true"], .mo-reihe button[aria-pressed="true"] { background: var(--akzent-dunkel); }
  .wz-hinweis { margin: 0; color: var(--leise); font-size: 13px; padding: 0 4px; white-space: nowrap; }
  #regler { grid-area: regler; overflow-y: auto; padding: 2px calc(12px + var(--sr)) 10px calc(12px + var(--sl)); background: var(--flaeche); overscroll-behavior: contain; }
  #reiter { grid-area: reiter; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 calc(2px + var(--sr)) var(--sb) calc(2px + var(--sl)); background: var(--grund); border-top: 1px solid var(--linie); overscroll-behavior: contain; }
  #reiter::-webkit-scrollbar { display: none; }
  #reiter button { position: relative; flex: 1 0 64px; min-width: 64px; height: var(--reiter); border: 0; border-radius: 0; background: none; font-size: 11px; letter-spacing: .02em; color: var(--leise); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 2px; }
  #reiter button::before { content: ""; position: absolute; top: 0; left: 50%; width: 26px; height: 2px; margin-left: -13px; border-radius: 2px; background: var(--akzent); transform: scaleX(0); transition: transform .2s ease; }
  #reiter button[aria-selected="true"] { color: var(--akzent); }
  #reiter button[aria-selected="true"]::before { transform: scaleX(1); }
  #reiter button[aria-selected="true"] svg { filter: drop-shadow(0 0 6px rgba(226, 166, 75, .45)); }

  /* ---------- Bildleiste (über dem Bild) ---------- */
  #bildleiste { grid-area: bild; align-self: end; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; padding: 10px calc(10px + var(--sr)) 10px calc(10px + var(--sl)); pointer-events: none; z-index: 4; }
  #bildleiste[hidden] { display: none; }
  .bl-gruppe { display: flex; gap: 8px; }
  .bl-gruppe button { pointer-events: auto; height: 44px; border-radius: 22px; background: rgba(12, 11, 9, .74); border-color: rgba(239, 232, 220, .14); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; font-size: 13px; touch-action: none; }
  .bl-gruppe button:not(:has(span)) { padding: 0; width: 44px; }
  .bl-gruppe button[aria-pressed="true"] { background: rgba(51, 38, 15, .92); }
  .bl-gruppe button[data-b="maske"][aria-pressed="true"] { border-color: var(--rot); color: #ff8a73; background: rgba(60, 20, 14, .9); }
  .bl-gruppe button[hidden] { display: none; }
  #pinselhinweis { grid-area: bild; align-self: start; justify-self: center; margin-top: 10px; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 7px 14px; border-radius: 20px; background: rgba(12, 11, 9, .8); border: 1px solid var(--akzent); color: var(--text); font-size: 13px; pointer-events: none; z-index: 4; }
  #pinselhinweis[hidden] { display: none; }
  #pinselhinweis svg { color: var(--akzent); width: 18px; height: 18px; }
  #pinselhinweis span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Start ---------- */
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(ellipse at 50% 38%, rgba(226, 166, 75, .09), transparent 62%); }
  #start[hidden] { display: none; }
  .start-karte { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 320px; }
  .start-logo { color: var(--akzent); margin-bottom: 4px; }
  .start-karte h1 { font: 400 34px/1.1 var(--serif); letter-spacing: .03em; margin: 0; }
  .start-karte p { margin: 0 0 10px; }
  #start button { min-height: 52px; padding: 0 28px; font-size: 16px; min-width: 240px; border-radius: 26px; }
  #start button.gross { min-height: 56px; font-size: 17px; }
  #start .zuletzt { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 10px; }
  #start .zuletzt button { min-height: 44px; font-size: 15px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; }

  /* ---------- Bausteine der Modi ---------- */
  .kachel { flex: 0 0 auto; min-height: 44px; max-width: 170px; font-size: 13px; line-height: 1.15; white-space: normal; border-radius: 22px; }
  #werkzeug .kachel.haupt { border-radius: 22px; }
  .kachel.look { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 8px; min-height: 52px; border-radius: 12px !important; font-size: 12px; }
  .kachel.look canvas { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; background: var(--flaeche); }
  #werkzeug:has(.kachel.look) { padding-top: 4px; padding-bottom: 4px; }
  .platzhalter { padding: 18px 4px; margin: 0; text-align: center; }
  .info p { margin: 10px 0; font-size: 14px; } .info p + p { color: var(--leise); font-size: 13px; }
  .regel { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 48px; gap: 0 8px; }
  .regel span { font-size: 15px; } .regel output { font-size: 13px; color: var(--leise); text-align: right; min-width: 44px; }
  .regel input { grid-column: 1 / -1; width: 100%; height: 44px; margin: -8px 0; accent-color: var(--akzent); touch-action: pan-y; }
  .leise-knopf { margin: 8px 0; background: none; color: var(--leise); }
  .chip.leise { background: none; color: var(--leise); }
  .mo-reihe { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .mo-reihe button { border-radius: 22px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .mo-seg { display: flex; flex: 1; } .mo-seg button { flex: 1; border-radius: 0; } .mo-seg button:first-child { border-radius: 22px 0 0 22px; } .mo-seg button:last-child { border-radius: 0 22px 22px 0; border-left: 0; }
  .mo-karte { display: flex; gap: 12px; align-items: flex-start; padding: 12px; margin: 10px 0; border: 1px dashed var(--linie); border-radius: 14px; }
  .mo-karte strong { display: block; font-size: 15px; margin-bottom: 4px; } .mo-karte p { margin: 0; color: var(--leise); font-size: 13.5px; line-height: 1.4; } .mo-karte b { color: var(--text); font-weight: 600; }
  .mo-symbol { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--akzent-dunkel); color: var(--akzent); flex: none; }
  .mo-leise { color: var(--leise); font-size: 12.5px; margin: 8px 4px; line-height: 1.4; }
  .mo-ueber { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .mo-bereich { display: inline-flex; align-items: center; border: 1px solid var(--linie); border-radius: 22px; background: var(--flaeche2); overflow: hidden; }
  .mo-bereich[aria-current="true"] { border-color: var(--akzent); background: var(--akzent-dunkel); }
  .mo-bereich button { border: 0; background: none; border-radius: 0; }
  #werkzeug .mo-bereich button { border-radius: 0; }
  .mo-auge { width: 44px; padding: 0 !important; justify-content: center; color: var(--leise); }
  .mo-auge[aria-pressed="false"] { color: #6d655b; }
  .mo-name { padding: 0 14px 0 2px !important; }
  .mo-bereich[aria-current="true"] .mo-name { color: var(--akzent); }
  .mo-punkt { display: inline-block; width: 12px; height: 12px; border-radius: 6px; border: 1px solid rgba(239, 232, 220, .35); flex: none; }
  .mo-namefeld { display: flex; align-items: center; gap: 10px; min-height: 48px; margin: 6px 0 2px; padding: 0 12px; border-radius: 12px; background: var(--flaeche2); border: 1px solid var(--linie); }
  .mo-namefeld input { flex: 1; min-width: 0; min-height: 44px; background: none; border: 0; color: var(--text); font: 600 16px system-ui, -apple-system, sans-serif; outline: none; -webkit-user-select: text; user-select: text; }
  .mo-farbfeld { width: 26px; height: 26px; border-radius: 13px; border: 2px solid rgba(239, 232, 220, .3); flex: none; }
  .mo-stift { color: var(--leise); display: inline-flex; }
  #werkzeug .mo-farbe { position: relative; flex-direction: column; justify-content: center; gap: 3px; min-width: 56px; height: 52px; padding: 0 4px; border-radius: 12px; background: none; border-color: transparent; font-size: 10.5px; color: var(--leise); }
  .mo-farbe i { display: block; width: 28px; height: 28px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
  #werkzeug .mo-farbe[aria-pressed="true"] { background: none; color: var(--akzent); }
  .mo-farbe[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--grund), 0 0 0 4px var(--akzent); }
  label.mo-farbe { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 56px; height: 52px; font-size: 10.5px; color: var(--leise); position: relative; }
  label.mo-farbe input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; }

  /* ---------- Meldungen, Vorher, Vergleich ---------- */
  .toast { position: absolute; left: 50%; bottom: 66px; transform: translate(-50%, 8px); max-width: calc(100% - 24px); background: rgba(19, 17, 15, .95); border: 1px solid var(--linie); border-radius: 12px; padding: 9px 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 5; }
  .toast.an { opacity: 1; transform: translate(-50%, 0); }
  .toast[data-art="fehler"] { border-color: var(--rot); }
  .vorher-hinweis { position: absolute; left: 12px; top: 12px; background: rgba(10, 9, 8, .85); border: 1px solid var(--akzent); color: var(--akzent); border-radius: 14px; padding: 4px 12px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 3; }
  .vorher-hinweis.an { opacity: 1; }
  .teilung { position: absolute; top: 0; bottom: 0; width: 0; display: none; z-index: 3; }
  .teilung::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: rgba(239, 232, 220, .85); }
  .teilung-griff { position: absolute; top: 50%; left: -22px; width: 44px; height: 44px; margin-top: -22px; border-radius: 22px; background: rgba(10, 9, 8, .7); border: 2px solid rgba(239, 232, 220, .85); touch-action: none; }
  .teilung span { position: absolute; top: 8px; font-size: 12px; background: rgba(10, 9, 8, .7); padding: 2px 6px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
  .teilung .t-l { right: 8px; } .teilung .t-r { left: 8px; }

  /* ---------- Blätter ---------- */
  .blatt { position: fixed; left: 0; right: 0; bottom: 0; max-height: 72%; background: var(--flaeche); border-top: 1px solid var(--linie); border-radius: 18px 18px 0 0; z-index: 20; display: flex; flex-direction: column; padding-bottom: var(--sb); box-shadow: 0 -10px 34px rgba(0, 0, 0, .6); }
  .blatt-kopf { display: flex; align-items: center; padding: 6px calc(8px + var(--sr)) 6px calc(16px + var(--sl)); border-bottom: 1px solid var(--linie); min-height: 52px; }
  .blatt-kopf strong { font: 400 19px var(--serif); letter-spacing: .02em; }
  .blatt-kopf button { background: none; border-color: transparent; padding: 0; width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .blatt-inhalt { overflow-y: auto; padding: 8px calc(16px + var(--sr)) 16px calc(16px + var(--sl)); overscroll-behavior: contain; }
  .zeile { display: flex; gap: 8px; margin: 8px 0; } .zeile button { flex: 1; line-height: 1.15; }
  .zeile small { color: var(--leise); font-size: 11px; }
  .fortschritt { height: 6px; background: var(--flaeche2); border-radius: 3px; overflow: hidden; margin: 10px 0; } .fortschritt div { height: 100%; width: 0; background: var(--akzent); transition: width .15s; }
  .ebene { display: grid; grid-template-columns: 44px 1fr 90px 44px; align-items: center; gap: 8px; min-height: 52px; border-bottom: 1px solid var(--linie); }
  .ebene button { padding: 0; display: inline-flex; align-items: center; justify-content: center; background: none; } .ebene button[aria-pressed="false"] { opacity: .45; }
  .ebene-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ebene input { width: 90px; height: 44px; margin: 0; accent-color: var(--akzent); }
  .zs { padding: 6px 0; } .zs-reihe { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; } .zs-reihe::-webkit-scrollbar { display: none; }
  .zs-reihe button { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
  .zs-dreh { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; min-height: 48px; }
  .zs-dreh input { width: 100%; accent-color: var(--akzent); height: 44px; margin: -8px 0; touch-action: pan-y; } .zs-dreh output { min-width: 48px; text-align: right; color: var(--leise); font-size: 13px; }
  .zs-rahmen { position: absolute; box-shadow: 0 0 0 9999px rgba(5, 5, 4, .64); outline: 1px solid rgba(239, 232, 220, .9); z-index: 2; touch-action: none; }
  .zs-drittel { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.35) 33.33%, transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) 66.66%, transparent calc(66.66% + .5px)), linear-gradient(180deg, transparent calc(33.33% - .5px), rgba(255,255,255,.35) 33.33%, transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) 66.66%, transparent calc(66.66% + .5px)); }
  .zs-inhalt { position: absolute; border: 1px dashed var(--akzent); pointer-events: none; display: none; }
  .zs-griff { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; touch-action: none; }
  .zs-griff::after { content: ""; position: absolute; left: 15px; top: 15px; width: 14px; height: 14px; border: 3px solid var(--text); border-radius: 3px; background: rgba(10, 9, 8, .4); }
  .zs-griff[data-e="nw"] { left: 0; top: 0; } .zs-griff[data-e="n"] { left: 50%; top: 0; } .zs-griff[data-e="no"] { left: 100%; top: 0; } .zs-griff[data-e="o"] { left: 100%; top: 50%; }
  .zs-griff[data-e="so"] { left: 100%; top: 100%; } .zs-griff[data-e="s"] { left: 50%; top: 100%; } .zs-griff[data-e="sw"] { left: 0; top: 100%; } .zs-griff[data-e="w"] { left: 0; top: 50%; }
  .batch-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 8px 0; }
  .batch-bild { position: relative; aspect-ratio: 1; background: var(--flaeche2); border-radius: 8px; overflow: hidden; border: 1px solid var(--linie); padding: 0; min-height: 44px; }
  .batch-bild canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .batch-bild span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; background: rgba(10,9,8,.75); padding: 2px 4px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .batch-bild [data-t="marken"] { position: absolute; left: 0; right: 0; top: 0; font-size: 11px; line-height: 1.35; background: rgba(20,18,16,.78); color: #c9c6bf; padding: 2px 4px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .batch-bild [data-t="marken"][data-ok="true"] { background: rgba(40,70,35,.88); color: #bfe3ad; }
  .batch-bild[data-st="fehler"] { border-color: #a04040; } .batch-bild[data-st="fertig"] { border-color: #4a7a4a; }
  .schalter { display: flex; align-items: center; gap: 10px; min-height: 48px; } .schalter input { width: 24px; height: 24px; accent-color: var(--akzent); }

  /* ---------- Einführung (3 Schritte, einmal) ---------- */
  .einf { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl)); background: rgba(6, 5, 4, .9); opacity: 0; transition: opacity .2s ease; }
  .einf.an { opacity: 1; }
  .einf-karte { width: 100%; max-width: 360px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 22px; padding: 20px; text-align: center; transform: translateY(14px); transition: transform .25s ease; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
  .einf.an .einf-karte { transform: none; }
  .einf-bild svg { width: auto; height: min(30vh, 200px); }
  .einf-karte small { color: var(--akzent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .einf-karte h2 { font: 400 24px/1.2 var(--serif); margin: 6px 0 8px; }
  .einf-karte p { margin: 0 0 14px; color: var(--leise); font-size: 14.5px; line-height: 1.45; }
  .einf-punkte { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .einf-punkte i { width: 18px; height: 4px; border-radius: 2px; background: var(--linie); transform: scaleX(.45); transition: transform .2s, background-color .2s; }
  .einf-punkte i.an { background: var(--akzent); transform: none; }
