<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mein Vorteil</title>
<!-- Umgezogen: Angebote, Vorteile und Konzerte stehen jetzt auf einer Seite (/Synquenzer/mein-vorteil/). -->
<noscript><meta http-equiv="refresh" content="0; url=/Synquenzer/mein-vorteil/#angebote"></noscript>
<link rel="canonical" href="/Synquenzer/mein-vorteil/">
<script>(function () {
  // Ziel immer absolut: auch eine Kopie an falscher Stelle (z. B. als /Synquenzer/ aus einem fremden Zwischenspeicher)
  // landet auf Mein Vorteil statt auf /mein-vorteil/ außerhalb des Repos (404).
  var p = location.pathname, i = p.indexOf('/schnaeppchen/');
  var basis = i >= 0 ? p.slice(0, i) : '/Synquenzer';
  var r = 'angebote';
  var ziel = basis + '/mein-vorteil/?von=schnaeppchen#' + r;
  var weg = false, los = function () { if (!weg) { weg = true; location.replace(ziel); } };
  // Eigener Worker für diesen Ordner (falls noch keiner – auch wenn gerade der SYNQUENZER-Worker der Wurzel übernimmt):
  // danach sieht der SYNQUENZER-Worker diese Adresse nie mehr
  var sw = 'serviceWorker' in navigator ? navigator.serviceWorker : null, eigen = /\/schnaeppchen\/sw\.js$/.test((sw && sw.controller && sw.controller.scriptURL) || '');
  if (i >= 0 && sw && !eigen && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    sw.register('sw.js', { scope: './' }).then(los, los); setTimeout(los, 600);
  } else los();
})();</script>
<style>
  body { margin: 0; padding: 24px max(16px, env(safe-area-inset-left)); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f2ee; color: #1f1d1a; }
  a { display: inline-flex; align-items: center; min-height: 44px; color: #2f6f5e; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #141317; color: #ecebef; } a { color: #7fcdb3; } }
</style>
</head>
<body>
<p>Die Schnäppchen sind umgezogen: <a href="/Synquenzer/mein-vorteil/#angebote">Mein Vorteil öffnen</a></p>
</body>
</html>
