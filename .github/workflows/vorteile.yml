# Vorteils-Radar: sucht stündlich Vorteile für Xander (Deals, Erleben, Reisen, Musik, Nebenverdienst, Tests)
# und meldet Seltenes sofort per ntfy, den Rest einmal am Tag (ab 18 Uhr). Code: vorteile/. Daten: Zweig "vorteile-daten".
name: Vorteils-Radar

on:
  schedule:
    - cron: '41 * * * *'   # jede Stunde um :41 (Zeitpläne laufen nur vom Standardzweig aus)
  workflow_dispatch:
    inputs:
      modus:
        description: 'auto = normal, digest = Zusammenfassung jetzt schicken, still = nichts senden'
        type: choice
        options: [auto, digest, still]
        default: auto
      alle:
        description: 'Alle Module sofort neu abfragen (Intervalle ignorieren)'
        type: boolean
        default: false
      roh:
        description: 'Roh-Mitschnitt: alle Module, alle Quell-Antworten + Ergebnis auf Zweig roh-daten, ohne Push und ohne Daten-Zweig'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ inputs.roh && 'vorteile-roh' || 'vorteile' }}   # Roh-Läufe stören die stündlichen Läufe nicht
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: vorteile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: vorteile
        run: npm test

      - name: Daten-Zweig holen (oder neu anlegen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" vorteile-daten >/dev/null; then
            git clone --quiet --depth 1 --branch vorteile-daten "$URL" daten
          else
            mkdir daten && git -C daten init --quiet -b vorteile-daten && git -C daten remote add origin "$URL"
          fi

      - name: Suchen und benachrichtigen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          MODUS: ${{ inputs.modus || 'auto' }}
          ROH_DIR: ${{ inputs.roh && format('{0}/roh', runner.temp) || '' }}
        run: node vorteile/scan/main.mjs --data daten/vorteile/data ${{ inputs.alle && '--alle' || '' }}

      - name: Daten speichern
        if: ${{ !inputs.roh }}
        working-directory: daten
        run: |
          git config user.name "vorteile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Daten des Vorteils-Radars\nAutomatisch erzeugt (stündlich). Code: Ordner vorteile/.\n' > README.md
          git add -A
          # Ein einziger Commit (der Verlauf steckt in zustand.json) -> der Zweig bleibt klein.
          git checkout --quiet --orphan neu
          git commit --quiet -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force origin neu:vorteile-daten

      # Nur bei roh: Mitschnitt auf den eigenen Zweig roh-daten unter vorteile/<Lauf-Nr.>/ (nie auf den Daten-Zweig).
      - name: Rohdaten speichern (Zweig roh-daten)
        if: ${{ always() && inputs.roh }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROH_DIR: ${{ runner.temp }}/roh
        run: |
          if [ ! -d "$ROH_DIR" ]; then echo "kein Mitschnitt vorhanden"; exit 1; fi
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" roh-daten >/dev/null; then
            git clone --quiet --depth 1 --branch roh-daten "$URL" roh-zweig
          else
            mkdir roh-zweig && git -C roh-zweig init --quiet -b roh-daten && git -C roh-zweig remote add origin "$URL"
          fi
          ZIEL="roh-zweig/vorteile/${GITHUB_RUN_ID}"
          mkdir -p "$ZIEL" && cp -R "$ROH_DIR"/. "$ZIEL"/
          cd roh-zweig
          git config user.name "roh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Rohdaten vorteile Lauf ${GITHUB_RUN_ID}"
          # Andere Wecker können gleichzeitig schreiben -> bei Ablehnung neu aufsetzen und wiederholen
          for i in 1 2 3 4 5; do
            if git push --quiet origin HEAD:roh-daten; then echo "gespeichert: vorteile/${GITHUB_RUN_ID}"; exit 0; fi
            sleep $((i * 4))
            git pull --quiet --rebase origin roh-daten || true
          done
          exit 1
