# Schnäppchen-Wecker: sucht stündlich nach Angeboten (Döbeln + online) und schickt Deals per ntfy aufs iPhone.
# Code: schnaeppchen/ (main). Daten: Zweig "schnaeppchen-daten" (nicht main -> GitHub Pages baut nicht jede Stunde neu).
name: Schnäppchen-Wecker

on:
  schedule:
    - cron: '17 * * * *'   # jede Stunde um :17 (läuft nur vom Standardzweig aus)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur testen, keine Push-Nachrichten senden'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'schnaeppchen/watchlist.json'
      - 'schnaeppchen/config.json'
      - 'schnaeppchen/scan/**'

permissions:
  contents: write

concurrency:
  group: schnaeppchen
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: schnaeppchen

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: schnaeppchen
        run: npm test

      - name: Daten-Zweig holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" schnaeppchen-daten >/dev/null; then
            git clone --quiet --depth 1 --branch schnaeppchen-daten "$URL" daten
          else
            mkdir daten && git -C daten init --quiet -b schnaeppchen-daten && git -C daten remote add origin "$URL"
          fi

      - name: Suchen und benachrichtigen
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node schnaeppchen/scan/main.mjs --data daten/schnaeppchen/data

      - name: Daten speichern
        working-directory: daten
        run: |
          git config user.name "schnaeppchen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Daten des Schnäppchen-Weckers\nAutomatisch erzeugt (stündlich). Code: Zweig main, Ordner schnaeppchen/.\n' > README.md
          git add -A
          # Ein einziger Commit (der Verlauf steckt in history.json) -> der Zweig bleibt klein.
          git checkout --quiet --orphan neu
          git commit --quiet -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force origin neu:schnaeppchen-daten
