# NUR auf Zweig preis-sonde: einmalige Preis-Sonde statt des Schnäppchen-Weckers.
# Läuft nur per Hand (workflow_dispatch mit ref preis-sonde). Kein Zeitplan, kein Push-Auslöser, keine ntfy-Nachricht,
# kein Daten-Zweig: das Ergebnis geht ausschließlich auf den Zweig roh-daten unter preis-sonde/<Lauf-Nr.>/.
name: Schnäppchen-Wecker

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '(ohne Wirkung auf diesem Zweig)'
        type: boolean
        default: true
      roh:
        description: '(ohne Wirkung auf diesem Zweig)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: preis-sonde
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: schnaeppchen

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preis-Sonde
        env:
          # Nur die Info, ob ein Schlüssel hinterlegt ist – der Schlüssel selbst geht nicht an die Sonde.
          KEEPA_GESETZT: ${{ secrets.KEEPA_KEY != '' }}
        run: node schnaeppchen/scan/sonde-historie.mjs --out "$RUNNER_TEMP/sonde"

      - name: Ergebnis speichern (Zweig roh-daten, Ordner preis-sonde/<Lauf-Nr.>)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUELLE: ${{ runner.temp }}/sonde
        run: |
          if [ ! -d "$QUELLE" ]; then echo "keine Sonden-Daten vorhanden"; exit 1; fi
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" roh-daten >/dev/null; then
            git clone --quiet --depth 1 --branch roh-daten "$URL" roh-zweig
          else
            mkdir roh-zweig && git -C roh-zweig init --quiet -b roh-daten && git -C roh-zweig remote add origin "$URL"
          fi
          ZIEL="roh-zweig/preis-sonde/${GITHUB_RUN_ID}"
          mkdir -p "$ZIEL" && cp -R "$QUELLE"/. "$ZIEL"/
          cd roh-zweig
          git config user.name "roh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Preis-Sonde Lauf ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            if git push --quiet origin HEAD:roh-daten; then echo "gespeichert: preis-sonde/${GITHUB_RUN_ID}"; exit 0; fi
            sleep $((i * 4))
            git pull --quiet --rebase origin roh-daten || true
          done
          exit 1
