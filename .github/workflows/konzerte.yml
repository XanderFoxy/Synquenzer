# Konzert- & Release-Alarm für Xander (Code in konzerte/). Schreibt nur auf den Branch konzerte-daten.
name: konzerte

on:
  schedule:
    - cron: '17 */3 * * *'   # alle 3 Stunden (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: konzerte
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: konzerte
          path: code

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --test code/konzerte/scan/test/*.test.mjs

      - name: Daten-Branch holen (oder neu anlegen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" konzerte-daten >/dev/null; then
            git clone --quiet --depth 1 --branch konzerte-daten "$url" daten
          else
            mkdir daten && cd daten && git init --quiet -b konzerte-daten && git remote add origin "$url"
          fi

      - name: Scannen und pushen
        env:
          DATA_DIR: ${{ github.workspace }}/daten
          TM_KEY: ${{ secrets.TM_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: node code/konzerte/scan/run.mjs

      - name: Daten speichern
        working-directory: daten
        run: |
          git config user.name "konzerte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit --quiet -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin HEAD:konzerte-daten
